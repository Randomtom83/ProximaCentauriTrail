<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PROXIMA TRAIL :: bridge of the ark-ship Proxima</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- CRT frame -->
  <div id="crt">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="flicker" aria-hidden="true"></div>

    <!-- Top status bar (always present) -->
    <header id="topbar">
      <span class="brand">▣ A.S.&nbsp;PROXIMA · BRIDGE</span>
      <span id="topbar-status"></span>
      <span class="topbar-btns">
        <button id="anim-btn" type="button" title="Toggle animations">▦ ANIM: ON</button>
        <button id="mute-btn" type="button" title="Toggle sound">♪ SND: ON</button>
      </span>
    </header>

    <!-- Everything renders into here. NOTE: no aria-live here — the whole screen must
         not re-announce every turn. Live announcements are scoped to #sr-live below. -->
    <main id="app"></main>

    <footer id="botbar">
      <span id="botbar-hint"> All hands · humanity's last ark · heading 0-1-1 mark Proxima</span>
      <span class="cursor" aria-hidden="true">█</span>
    </footer>

    <!-- Scoped screen-reader announcer: only NEW log/status lines land here, so the
         whole #app no longer re-announces every turn. Visually hidden (.sr-only). -->
    <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Between-scene transit animation (cruise / dock / hazard / land).
       All artwork is STATIC inline SVG — playTransit only flips data-variant;
       CSS decides which destination art shows. No dynamic markup sinks. -->
  <div id="transit" class="overlay hidden" aria-hidden="true" data-variant="cruise">
    <div class="transit-scene">
      <div class="stars s1"></div>
      <div class="stars s2"></div>
      <div class="stars s3"></div>
      <div class="transit-vignette"></div>

      <div id="transit-dest" class="transit-dest">
        <!-- dock: ring station -->
        <svg class="dest-art dest-dock" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="#6fdcff" stroke-width="2.5" opacity=".9"/>
          <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="#bfe9ff" stroke-width="1" opacity=".35" transform="rotate(6 60 60)"/>
          <rect x="55" y="30" width="10" height="60" rx="4" fill="#16233f" stroke="#4a90e8" stroke-width="1.5"/>
          <circle cx="60" cy="60" r="9" fill="#0d1830" stroke="#6fdcff" stroke-width="2"/>
          <rect x="57" y="22" width="6" height="8" rx="2" fill="#16233f" stroke="#4a90e8"/>
          <circle class="blink-a" cx="60" cy="19" r="2" fill="#ffb14e"/>
          <circle class="blink-b" cx="14" cy="60" r="1.6" fill="#46f0a6"/>
          <circle class="blink-a" cx="106" cy="60" r="1.6" fill="#ff4d5e"/>
        </svg>
        <!-- land: Proxima Centauri b -->
        <svg class="dest-art dest-land" viewBox="0 0 140 140" width="140" height="140" aria-hidden="true">
          <defs>
            <radialGradient id="pxb" cx="32%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#ffe3ae"/><stop offset="34%" stop-color="#e0913f"/>
              <stop offset="66%" stop-color="#7c4220"/><stop offset="100%" stop-color="#170b05"/>
            </radialGradient>
          </defs>
          <circle cx="70" cy="70" r="56" fill="url(#pxb)"/>
          <circle cx="70" cy="70" r="56" fill="none" stroke="#ffb14e" stroke-width="1.4" opacity=".55"/>
          <path d="M 30 40 Q 58 30 82 44 Q 64 46 46 56 Q 34 50 30 40 Z" fill="#ffd9a0" opacity=".22"/>
          <path d="M 40 96 Q 66 86 100 92 Q 80 104 58 104 Q 46 102 40 96 Z" fill="#5a2f18" opacity=".5"/>
        </svg>
        <!-- hazard: debris shards + warning -->
        <svg class="dest-art dest-hazard" viewBox="0 0 120 120" width="110" height="110" aria-hidden="true">
          <g class="shard-drift">
            <polygon points="30,34 44,28 40,42" fill="#22406e" stroke="#6fdcff" stroke-width="1"/>
            <polygon points="76,20 90,26 82,36 72,30" fill="#16233f" stroke="#4a90e8" stroke-width="1"/>
            <polygon points="58,58 74,52 78,66 62,70" fill="#22406e" stroke="#6fdcff" stroke-width="1.2"/>
            <polygon points="26,78 40,72 44,84 30,90" fill="#16233f" stroke="#4a90e8" stroke-width="1"/>
            <polygon points="84,84 98,80 94,96" fill="#22406e" stroke="#6fdcff" stroke-width="1"/>
          </g>
          <g class="warn-pulse">
            <polygon points="60,8 68,22 52,22" fill="none" stroke="#ff4d5e" stroke-width="2.5"/>
            <line x1="60" y1="13" x2="60" y2="18" stroke="#ff4d5e" stroke-width="2"/>
          </g>
        </svg>
      </div>

      <!-- THE ARK — humanity's last home: drive, radiators, cargo spine,
           cryo pods, habitat ring, lit command prow. -->
      <div id="transit-ship" class="transit-ship">
        <svg class="ark" viewBox="0 0 250 84" width="250" height="84" aria-hidden="true">
          <defs>
            <linearGradient id="plume" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#6fdcff" stop-opacity="0"/>
              <stop offset="55%" stop-color="#4a90e8" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#dff4ff" stop-opacity=".95"/>
            </linearGradient>
            <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#24385e"/><stop offset="55%" stop-color="#131f38"/><stop offset="100%" stop-color="#0a1226"/>
            </linearGradient>
          </defs>
          <g class="ark-plume">
            <polygon points="4,42 46,35 46,49" fill="url(#plume)"/>
            <polygon points="16,42 46,38 46,46" fill="#eaf7ff" opacity=".8"/>
          </g>
          <g class="ark-engines">
            <polygon points="46,30 66,30 66,54 46,54 42,48 42,36" fill="url(#hull)" stroke="#4a90e8" stroke-width="1.2"/>
            <rect x="44" y="35" width="5" height="5" rx="1" fill="#0a1226" stroke="#6fdcff" stroke-width=".8"/>
            <rect x="44" y="44" width="5" height="5" rx="1" fill="#0a1226" stroke="#6fdcff" stroke-width=".8"/>
            <polygon points="54,30 74,14 80,16 62,30" fill="#131f38" stroke="#d98324" stroke-width="1"/>
            <polygon points="54,54 74,70 80,68 62,54" fill="#131f38" stroke="#d98324" stroke-width="1"/>
            <line x1="74" y1="15" x2="79" y2="16.6" stroke="#ffb14e" stroke-width="1" opacity=".85"/>
            <line x1="74" y1="69" x2="79" y2="67.4" stroke="#ffb14e" stroke-width="1" opacity=".85"/>
          </g>
          <g class="ark-spine">
            <rect x="66" y="39" width="86" height="6" fill="#131f38" stroke="#4a90e8" stroke-width="1"/>
            <line x1="74" y1="39" x2="74" y2="45" stroke="#22406e" stroke-width="1"/>
            <line x1="94" y1="39" x2="94" y2="45" stroke="#22406e" stroke-width="1"/>
            <line x1="134" y1="39" x2="134" y2="45" stroke="#22406e" stroke-width="1"/>
            <rect x="76" y="31" width="14" height="6" rx="3" fill="url(#hull)" stroke="#4a90e8" stroke-width=".9"/>
            <rect x="96" y="31" width="14" height="6" rx="3" fill="url(#hull)" stroke="#4a90e8" stroke-width=".9"/>
            <rect x="76" y="47" width="14" height="6" rx="3" fill="url(#hull)" stroke="#4a90e8" stroke-width=".9"/>
            <rect x="96" y="47" width="14" height="6" rx="3" fill="url(#hull)" stroke="#4a90e8" stroke-width=".9"/>
            <circle cx="83" cy="34" r="1" fill="#6fdcff" opacity=".8"/><circle cx="103" cy="34" r="1" fill="#6fdcff" opacity=".8"/>
            <circle cx="83" cy="50" r="1" fill="#6fdcff" opacity=".8"/><circle cx="103" cy="50" r="1" fill="#6fdcff" opacity=".8"/>
          </g>
          <g class="ark-ring">
            <ellipse cx="132" cy="42" rx="11" ry="27" fill="none" stroke="#22406e" stroke-width="3"/>
            <ellipse cx="132" cy="42" rx="11" ry="27" fill="none" stroke="#6fdcff" stroke-width="1.6"/>
            <ellipse class="ring-sweep" cx="132" cy="42" rx="11" ry="27" fill="none" stroke="#dff4ff" stroke-width="2" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round"/>
          </g>
          <g class="ark-command">
            <polygon points="152,34 214,33 236,40 236,44 214,51 152,50" fill="url(#hull)" stroke="#4a90e8" stroke-width="1.2"/>
            <polygon points="214,33 236,40 236,44 214,51 220,42" fill="#1b2c4d" stroke="#6fdcff" stroke-width=".8"/>
            <line x1="206" y1="38" x2="224" y2="41" stroke="#ffb14e" stroke-width="1.6" opacity=".95"/>
            <line x1="160" y1="37" x2="196" y2="36.4" stroke="#22406e" stroke-width="1"/>
            <line x1="160" y1="47" x2="196" y2="47.6" stroke="#22406e" stroke-width="1"/>
            <line x1="168" y1="33" x2="168" y2="26" stroke="#4a90e8" stroke-width="1"/>
            <circle cx="168" cy="25" r="1.5" fill="#6fdcff"/>
          </g>
          <circle class="blink-a" cx="60" cy="27" r="1.6" fill="#ff4d5e"/>
          <circle class="blink-b" cx="230" cy="46" r="1.6" fill="#46f0a6"/>
        </svg>
      </div>

      <div id="transit-cap" class="transit-cap"></div>
      <div class="transit-skip">SKIP ▸ (click / space)</div>
    </div>
  </div>

  <!-- Generic modal overlay (events / hazards / choices / load-shed) -->
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box" tabindex="-1">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-art" class="modal-art"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-choices" class="modal-choices"></div>
    </div>
  </div>

  <!-- Mining mini-game overlay -->
  <div id="minigame" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box wide">
      <div class="modal-title">⛏ ASTEROID MINING</div>
      <div id="mg-hud" class="mg-hud"></div>
      <div id="mg-field" class="mg-field"></div>
      <div id="mg-footer" class="mg-footer"></div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
