    body:"The home crossing already had its events, scavenging, pursuer and fold — but its hazards (debris/vflare/micromet) each resolved on a single FIXED success/failure check; there was no clean→catastrophic spectrum on the home front like the outbound journey's HAZARDS crossings. P3-M3 adds that spectrum as a SIBLING of the outbound layer (NOT a reuse): the outbound resolveHazard/applyHazardSeverity read game.ship.hull / awake()/game.crew / power.allocation.sensors / autopilot / game.distance and call the FROZEN applyOutcome + a BARE endGame, so reusing them would corrupt outbound state or hard-end a run that should compose. DECISION 1 (resolved): a separate HOME_HAZARDS table, with debris/vflare/micromet MOVED OUT of VOYAGE_EVENTS and recast as sampled crossings (they are the canonical 'crossing' perils; leaving them binary while new hazards sampled would be incoherent and duplicate debris/flare mechanics); the narrative/economy/navigation beats (derelict, cache, fold, pursuer, lost, word, longdark, newlife, calm, sick) stay as choice-events, untouched. BUILT (game.js, sibling-local): HOME_HAZARDS (debris field / stellar flare / micrometeoroid swarm); voyageHazardDanger(op) = op.risk + (100−v.ship.hull)/240 − (role==='Pilot'?pilot:pilot*0.4)/320 (pilot = skillAwake('Pilot', v.crew)) + 0.12 on voyPower().brownout (replacing the outbound sensors-off term) + max(0,−caution)/500 + max(0,aggress)/800 − (potential−50)*0.0025, ×DIFFICULTY.harsh, clamp(0.03,0.95) — NO sensors-allocation / NO autopilot term — then the SAME sampleWeighted spectrum/weights as the outbound; voyageHazardSeverity(hz,sev,op) applies clean→crippling entirely via voyageOutcome on game.voyage (graze hull; serious hull + injure/afflict v.crew; casualty hull + killCrew(…,v.crew) with a chance of a second; crippling hull + fuel/oxygen + a distance setback) and CATASTROPHIC → finishVoyage(false,'LOST WITH ALL HANDS',deathText) → tryCompose, never a bare endGame; rollHomeHazard/presentHomeHazard/resolveHomeHazard orchestrate pick → (modal, or off-front auto-safe option resolved INLINE with no modal) → cost → danger → sample → apply. The voyageTurn hook replaced the lone `if (chance(0.5)) rollVoyageEvent(auto)` with a single peril roll splitting hazard (HOME_HAZARD_P=0.18) / event (HOME_EVENT_P=0.34) / quiet, mirroring the colony's hazard/event split. Composition: a lost ark with an ACTIVE colony makes tryCompose WAIT (no hard-end, the colony fights on); with a SETTLED colony it composes composeEnding's cWon && !vWon branch → A WORLD, AT LEAST (or A WORLD, AND WORD with a heard beacon). OUT OF SCOPE (flagged): the Earth-signal arc + Years-Since-Exodus dread clock + generations (P3-M4 — the TOO LATE Earth-silence arrival that dominates a long sound crossing is THAT clock, not a hazard); composeEnding generalization (M-INT1); hazard probability/weight tuning (M-INT2). Verified: node --check; ZERO-DIFF GATE — applyOutcome/resolveCheck/composeEnding/tryCompose AND the outbound applyHazardSeverity/resolveHazard/HAZARDS table all md5-identical to HEAD (the home layer is a sibling; the only other game.js changes are the one-line voyageTurn hook and removing 3 entries from VOYAGE_EVENTS); new /tmp/homehaz.js (24 assertions: full clean→catastrophic spectrum reachable with scaling effects — no harm on clean, injure at serious, kill at casualty, distance setback at crippling; catastrophic finishes the VOYAGE LOST WITH ALL HANDS, WAITS with an active colony and COMPOSES A WORLD, AT LEAST with a settled one; a wounded ark — low hull + brownout — samples a worse severity than a sound one at the same roll; a hazard never touches outbound game.ship/game.crew; the headless off-front auto hazard resolves with no modal and no error); new /tmp/homesmoke.js (120 full crossings: SOUND ark 98% survive and wins occur → winnable; WOUNDED ark 40% LOST WITH ALL HANDS vs 2% for the sound ark → real, hull-sensitive death risk, not an unwinnable deathtrap; zero JS errors); crossingm2 + colonyskel + colonym2..m6 + colonyfix + decisionm1 + feattest + fuzz + arrivalfix all green." },
  { date:"2026-06-27", tag:"decision", title:"P3-M3 — Home hazards are a SIBLING layer + a separate HOME_HAZARDS pool (the three crossings migrated in)",
    body:"Two decisions for the home-front hazard spectrum. (1) SIBLING, not reuse: the outbound resolveHazard/applyHazardSeverity are coupled to game.ship/game.crew/game.distance and call the frozen applyOutcome + a bare endGame, so the home front gets voyageHazardDanger/voyageHazardSeverity operating on game.voyage via voyageOutcome, with catastrophe ending the VOYAGE (finishVoyage→tryCompose) so a live colony still composes — leaving the four frozen functions AND the outbound applyHazardSeverity/resolveHazard/HAZARDS table byte-identical. (2) DECISION 1: a SEPARATE HOME_HAZARDS pool rather than upgrading the discrete events in place, and debris/vflare/micromet are MOVED OUT of VOYAGE_EVENTS into it (recast as sampled crossings) to avoid duplicate debris/flare mechanics and keep one resolution model per pool; the narrative/economy/navigation beats remain choice-events. Rejected: parameterizing the outbound machinery (would corrupt outbound state / hard-end composable runs); upgrading the three events in place (mixes two resolution models in rollVoyageEvent); a new hazard set kept alongside the old debris/flare events (duplication)." },
  { date:"2026-06-27", tag:"fix", title:"Game-A polish — arrival: 'overtaken' no longer blocks colonizing",
    body:"A playtest-surfaced arrival bug: in arrivalChoices(), the 'STAY — colonize' option was gated `if (viable && !d.overtaken)`. So on a VIABLE world where another expedition had beaten you here (d.overtaken true) and the world wasn't a natives world, the colony option was silently dropped — leaving a one-option arrival modal (just RETURN → beginReturn), which auto-flies the whole crew home with no colony, no crew split, and no provisioning. The natives 'MAKE CONTACT' colony option on the very next line was NOT gated on overtaken, confirming the `&& !d.overtaken` was an oversight, not intent (arriving second doesn't make a habitable world unsettleable — you can still plant a colony beside the earlier arrivals). FIX (one line, minimal): the STAY/colonize guard is now `if (viable)`. Everything else in arrivalChoices is unchanged — MAKE CONTACT stays (natives), RETURN stays, PUSH ON stays gated on !viable; beginReturn/beginColony/resolveActTwo and the d.overtaken sampling are untouched, and the overtaken arrival flavor line still fires. FLAGGED OUT OF SCOPE (separate decision, not done here): removing/deferring the legacy immediate RETURN/PUSH-ON arrival choices on viable worlds (the 'going home is earned' realignment). Verified: node --check; ZERO-DIFF GATE applyOutcome/resolveCheck/composeEnding/tryCompose md5-identical to HEAD (the fix touches none of them; the diff is the single guard line); new /tmp/arrivalfix.js (drives real arrivals and asserts a viable+overtaken+none world now OFFERS 'STAY — colonize' routing to beginColony/LANDFALL and still offers RETURN; a non-viable+overtaken world still offers RETURN+PUSH ON and NOT colonize; a natives+overtaken world still offers MAKE CONTACT); feattest + fuzz + colonyskel + colonym2..m6 + decisionm1 all green." },
  { date:"2026-06-27", tag:"feature", title:"P3-M2 — Unfreeze the home crossing (Game B proper begins; the ark now flies the existing loop)",
    body:"The home crossing turn loop did not need building — it already existed in full (a complete S15-era SIBLING of the outbound loop: voyageTurn / voyPower / VOYAGE_EVENTS / rollVoyageEvent / presentVoyageEvent / resolveVoyageCheck / voyageOutcome / voyageArrive / finishVoyage / voyageStep / voyageAutoStep / voyageHibernate / voyageRest / voyageScavenge / renderVoyage, with the Phase-R _starve/_anoxia teeth, hibernation, earthSignal(), tiered arrival endings, and a real HUD). P3-M1 had deliberately FROZEN it behind a _flying flag (doLaunch parked the ark). P3-M2 is therefore UNFREEZE + AUDIT + VERIFY, not a rebuild. Re-anchored against source first (commit 6d741e8) and confirmed, rather than rebuilt: confirmSettlement already carries the P3-M1 shipOut guard (settling with a live voyage does NOT hard-end — finishColony(true,'SETTLED')→tryCompose WAITS); composeEnding's `if (c && v)` branch already composes SETTLED + voyage → TWO WORLDS / A WORLD, AT LEAST / THE MESSENGER; tryCompose already waits for both fronts; the focus handler already switches screens; the off-front already auto-ticks (voyageAfterTurn→colonyAutoStep). A staleness audit found every voyage helper + const still live post-colony-rebuild (nothing renamed/removed). THE ONLY CODE CHANGE: doLaunch now calls startVoyage(returnees, prov, true, /*fly=*/true) — launching a colony-built ark flows straight into the crossing (option (a), simplest). The six _flying===false guards stay and now only catch a legacy P3-M1-era parked save; for those, renderVoyage's placeholder gained a ▶ Begin the crossing control (dispatch voyage:begin → _flying=true) so no save is stranded. beginReturn (the legacy arrival turn-around, _flying defaults true) shares the same loop unchanged and is not double-built. OUT OF SCOPE (flagged, not built): a sampled-severity HOME_HAZARDS crossing (P3-M3 — confirmed absent: applyHazardSeverity is outbound/colony-only); the visible Years-Since-Exodus dread clock (P3-M4 — a Year line already renders); a fuller bidirectional focus toggle (M-INT1b — the off-front stays on the existing auto-step). Verified: node --check; ZERO-DIFF GATE applyOutcome/resolveCheck/composeEnding/tryCompose md5-identical to HEAD (the unfreeze touches none of them); new /tmp/crossingm2.js (a colony-launched ark FLIES not parks and a turn advances; the Phase-R teeth bite — _anoxia/_starve escalate and wound; brownout halves scrubber recovery; a hibernated returnee doesn't act/eat as awake; arrival reaches MESSENGER / THE LONG WAY HOME / TOO LATE and can be LOST WITH ALL HANDS; the colony auto-ticks while the ark flies; SETTLING the colony WHILE the ark flies does NOT hard-end and composes TWO WORLDS on arrival; v7 round-trips a flying voyage); colonyskel + colonym2..m6 + colonyfix + decisionm1 + feattest + fuzz all green (decisionm1's P3-M1 'parked / does-not-fly' assertions updated to the P3-M2 truth — the ark now flies). Game B proper is live: launch a split crew, fly the ark home on the existing loop while the colony runs in parallel, and a settled colony + an arriving ark compose TWO WORLDS. STOP — P3-M3 (home content/hazards) awaits reconfirm." },
  { date:"2026-06-26", tag:"feature", title:"P3-M1 — The Decision + launch machinery (the Game-A→Game-B hinge; the home FRONT exists, nothing flies yet)",
    body:"The foothold's one-time '⚖ The future' beat — which in P2-M6 only TEASED a road home behind a disabled 'coming in P3-M1' line — is now the real, live DECISION, and every piece of the launch is built EXCEPT the crossing itself (that turn loop is P3-M2). The hub (openFutureDecision, retitled ⚖ The Decision) offers four non-exclusive choices once footholdReached: STAY and keep building · READY &amp; SEND THE SHIP HOME (→ readiness gate → crew-split roster) · SEND A BEACON (the cheaper light-speed hedge) · FOUND THE SETTLEMENT (the standalone win). FIXES + STATE: (1) the launch readiness gate was a DEAD no-op — colonyLaunch gated on col.shipReady, a field never declared anywhere (undefined &lt; 100 → always false → launch could never fire); it now gates on the LIVE col.shipReadiness (written by Refit, already taxed by structuralDebt through its reader) against a new fixed LAUNCH_READY (100, flagged for M-INT2). Below the bar the launch path shows DISABLED with a plain 'not spaceworthy yet — keep refitting' hint. (2) The crew-split roster now enforces a TRUE split — at least one RETURN to fly the ark AND at least one STAY to hold the colony (the old gate only required ≥1 RETURN, which allowed an all-aboard launch that abandoned the colony); children and anyone in cold sleep are shown STAY-locked (can't crew the ark). (3) doLaunch provisions the ark from colony stores CAPPED to HOLD_MAX (trim food→oxygen→fuel to fit, mirroring cargoUsed; medicine hold-exempt), DEDUCTS those provisions from the colony (a real both-fronts cost), moves the RETURN crew into game.voyage and OFF the colony roster, and creates the voyage with _flying:false. (4) sendBeacon() is the missing WRITER for col.beaconHeard (declared + read by composeEnding since P2-M5, but never written): it sets beaconHeard = (game.earth.status !== 'silent') — a real timing call, sending while Earth still listens is the hedge — and is one-shot (can't recall or re-send). (5) confirmSettlement re-guard (the P2-M6 forward marker, now due): founding the settlement while an ark is in flight records colonyDone(SETTLED) and tryCompose WAITS for the live voyage (composing TWO WORLDS later) rather than hard-ending — the mechanism was already correct, so only the confirm COPY reflows ('you've founded the colony; the ark's fate is still unwritten') and the view follows the ship out. (6) A _flying flag freezes the legacy crossing tick: voyageTurn / voyageStep / voyageAutoStep and the colony's auto-voyage nudge all no-op while _flying===false, and renderVoyage shows an 'the ark is away — the crossing begins' placeholder. The legacy arrival-RETURN path (beginReturn) omits the flag and still flies exactly as before. Held: applyOutcome / resolveCheck stay BYTE-IDENTICAL (zero-diff gate verified md5-equal); composeEnding / tryCompose were NOT rewritten (they already compose colony×voyage and already wait for an active voyage). Verified: node --check; zero-diff md5-identical; new /tmp/decisionm1.js (readiness gate blocks below / allows at the bar; roster rejects all-STAY and all-RETURN, accepts a split; doLaunch deducts + caps at HOLD_MAX + moves RETURN crew into game.voyage and NOTHING crosses across colony cycles; sendBeacon writes beaconHeard for live AND silent Earth + one-shot; Found-with-a-live-ark records SETTLED WITHOUT ending while a STAY path reaches the SETTLED end screen; v7 round-trip of the launch state); colonyskel + colonym2..m6 + colonyfix + feattest + fuzz all green; m6smoke still reaches SETTLED. A launch-path run sets up the launch STATE and pauses at the parked ark; a STAY-path run still completes normally to SETTLED. STOP — the home crossing turn loop is P3-M2, after Tom reconfirms." },
  { date:"2026-06-26", tag:"decision", title:"P3-M1 — Launch home is a TRUE crew split (≥1 stays AND ≥1 returns)",
    body:"The homeward launch splits the crew, and the split must be genuine: at least one crewmate STAYS to hold the colony and at least one RETURNS to fly the ark. The ark never lifts off empty and never strands the colony to fly everyone home. Children and anyone still in cold sleep can't crew the ark — they're shown STAY-locked. Rejected: the inherited gate that only required ≥1 RETURN, which allowed an all-aboard launch abandoning the colony (incoherent with the parallel-fronts model where the colony front must persist to compose TWO WORLDS). The roster disables Launch with a specific reason until both sides have a hand (‘Assign at least one to RETURN’ / ‘At least one must STAY to hold the colony’)." },
  { date:"2026-06-26", tag:"decision", title:"P3-M1 — Settling stays available with an ark in flight; it COMPOSES (TWO WORLDS), never hard-ends",
    body:"Founding the settlement while a ship is already out there does NOT end the game. finishColony(true,'SETTLED') records colonyDone and tryCompose WAITS because the voyage is active+pending, so composeEnding fires later weighing BOTH fronts (TWO WORLDS when the ark also makes it). This was the P2-M6 forward marker — and the mechanism was already correct (tryCompose's `voyage.active && !voyageDone` guard), so P3-M1 changed only the confirm COPY (when a ship is away it reads ‘you've founded the colony; the ark's fate is still unwritten,’ not a hard finale) and made the view follow the ark out. Rejected: blocking the settle while a ship is live (it's a legitimate, separate victory), and hard-ending on settle (which would throw away the in-flight ark and the richer composed ending). Availability is unchanged — only the copy and the post-confirm navigation." },
  { date:"2026-06-26", tag:"fix", title:"Game-A polish — colony-loop fixes DELIVERED (heal valve · safe gather · cycles clock)",
    body:"Built the scoped FIX pass parked below — the colony loop is now playable when struggling instead of a death spiral with no valve. Five fixes, all in game.js, routed through colonyTurn and its applyColonyOutcome / resolveColonyCheck siblings (the two stay BYTE-IDENTICAL to HEAD — zero-diff gate verified md5-equal). (1) CLOCK = CYCLES: the colony counter is relabeled 'Cycle N' everywhere player-facing, and the Earth-frame clock is decoupled — a new CYCLE_YEARS (0.5) advances elapsedYears by a small honest fraction per cycle (never +1/turn) off a fixed _exodusYear landfall base, with a matching gentle aging drift on the founders via colonyAgeDrift() (reuses OLD_AGE / COME_OF_AGE; does NOT call the journey ageCrew(), so shipYears and journey-only pregnancy/birth are untouched). The '45-year-old at Year 59 / 82 since exodus' contradiction is dissolved at the root — founders age a little over a colony's life, not frozen, no mass die-off; drift runs after aliveBefore is captured so an elder's death still cascades hope. (2) TEND HEALS: Tend now mends bodies in addition to hope/trauma — heals awake living crew and clears one Sick/Injured the way the ship's auto-medbay does, boosted by an awake Medic. (3) PER-CYCLE RECOVERY: colonyRecovery() is the colony analog of the auto-medbay — a small passive heal + a chance to clear a lingering ailment, ONLY on safe (non-crisis) cycles with a healthy, powered medical-care axis, gated up by an awake Medic; none on crisis cycles. (4) WORK/HARVEST: a new safe season action (👷 Work) — the colony analog of journey Mine — a modest, risk-free materials/food yield scaled by colHands + tech, no ecoHarm, deliberately out-paid by the riskier Expedition. (5) EMPTY-WORLD TRADE: on none worlds (where Contact-trade is natives-only) a Work cycle renders a genuine ration SURPLUS (food ≥ 80) down into preservable meds — a minimal trade valve that never taxes ordinary work. Game B (colonyLaunch/doLaunch/startVoyage/sendBeacon) stays dormant. Forward-link honored: the decoupled elapsedYears is the honest substrate the P3-M4 years-since-exodus clock and P3-M2 generations will read. Verified: node --check game.js audio.js; applyOutcome/resolveCheck md5-IDENTICAL to HEAD; new /tmp/colonyfix.js (Tend heals + clears Sick while a bare Hold does not; a SAFE colony passively heals an injured colonist 40→61 over 3 cycles while a CRISIS colony gets none, 40→21; Work lifts materials/food with no death/ecoHarm and scales with hands; the surplus→meds valve fires on a none world; the clock counts CYCLES with an honest elapsedYears 24→26 over 3 cycles and a 34→35.5 aging drift — not frozen, not +N — and a v7 round-trip continues honestly to cycle 6 / elapsedYears 27 / age 37; HUD + logs read 'Cycle' not 'Year'); colonyskel + colonym2..m6 + feattest + fuzz (60 runs) all green; m6smoke still reaches SETTLED (Settler 10 / Voyager 14 seasons — the gate scales). The colony is now MORE survivable but not trivial — flagged for the M-INT2 balance sweep." },
  { date:"2026-06-26", tag:"feature", title:"Game-A polish — colony-loop fixes locked (heal valve · safe gather · cycles clock); SCOPE PARKED, build is next session",
    body:"A scoped FIX pass between P2-M6 (Game A delivered) and P3-M1 (Game B) — recorded + greenlit now, NO game code in this commit (plan + dashboard only; Tom builds it next session). Playtesting the delivered colony surfaced three loop defects + one trade gap that make a struggling colony UNPLAYABLE rather than hard: (1) NO way to heal — colonyTurn only ever damages, Tend touched only hope/trauma, and there's no colony analog of the ship's auto-medbay; (2) NO safe labor→resource action — materials come only from risky, can-kill Expeditions and events, so a materials-starved colony has no non-lethal agency (a death spiral with no valve); (3) the 'Year' counter added a full Earth-year per turn while crew never aged — the '45-year-old at Year 59 / 82 since exodus' contradiction and a biologically frozen colony; plus (4) on none/uninhabited worlds there is NO trade at all (Contact-trade is natives-only). The locked plan — five fixes, all in game.js, routed through colonyTurn and its applyColonyOutcome / resolveColonyCheck siblings: relabel the counter Year→CYCLE and decouple an honest elapsedYears (a small Earth-fraction per cycle, never +1/turn) with a matching small aging drift on colony crew; Tend now also mends bodies + clears Sick/Injured like the auto-medbay (boosted by an awake Medic); a passive per-cycle recovery tick when the colony is _safe and the Medical axis is healthy (none on crisis turns); a new safe Work/Harvest season action (modest materials/food scaled by colHands + tech, no ecoHarm, still out-paid by risky Expeditions); and a minimal resource-convert for empty worlds. Guardrails: applyOutcome/resolveCheck stay BYTE-IDENTICAL (zero-diff gate); Game B (colonyLaunch/doLaunch/startVoyage/sendBeacon) stays dormant. Forward-link: the decoupled elapsedYears is the honest substrate the P3-M4 years-since-exodus clock and P3-M2 generations will read, so doing it now de-risks both. STATUS: scope + the two decisions below LOCKED; implementation parked for the next session per Tom's STOP — verification suite (node --check, zero-diff gate, new /tmp/colonyfix.js, smoke win-rate, colonyskel+m2..m6+feattest+fuzz) runs when it's built." },
  { date:"2026-06-26", tag:"decision", title:"Game-A polish — CLOCK = CYCLES, not Years (option C)",
    body:"The colony counter was advancing a full Earth-YEAR per turn while crew never aged, producing the contradiction of a 45-year-old founder at 'Year 59 / 82 since exodus' and a biologically frozen colony. Chosen (option C): a tidally-locked red-dwarf world (Proxima Centauri b: ~11.2-day orbit, likely no normal day/night) has no honest Earth calendar, so the colony counter is relabeled 'CYCLE N', and the Earth-frame 'years since exodus' becomes a SEPARATE, honest stat (elapsedYears) that advances by a small FRACTION of an Earth year per cycle — never +1/turn — with colony crew aging by that same small per-cycle amount (reusing the aging-rate / OLD_AGE / come-of-age constants, NOT the journey ageCrew() which also advances shipYears and fires journey-only birth). Founders age a little over a normal Game-A — not frozen, no mass die-off. This dissolves the age contradiction at the ROOT and lays the honest substrate the P3-M4 years-since-exodus clock and P3-M2 generations need. Rejected: keep +1 Earth-year/turn (the contradiction itself) and freeze the clock entirely (loses the Earth-frame the endings + generations want)." },
  { date:"2026-06-26", tag:"decision", title:"Game-A polish — HEAL + SAFE-GATHER reuse the journey's verbs (option A)",
    body:"The colony could only ever LOSE health: colonyTurn only damages, Tend touched only hope/trauma, and materials came solely from risky can-kill Expeditions — a death spiral with no valve. Chosen (option A): reuse Act-I patterns rather than invent new colony-only systems. Tend now actually MENDS bodies (heals awake living crew + clears a Sick/Injured status the way the ship's auto-medbay does, boosted by skillAwake('Medic')); a passive per-cycle RECOVERY tick is the colony analog of the ship's auto-medbay (a small heal + a chance to clear a lingering ailment, ONLY when the colony is _safe and the Medical-care survival axis is healthy, gated up by an awake Medic / powered infirmary, NONE on crisis turns); and a new safe WORK/HARVEST season action is the colony analog of journey Mine (a modest, risk-free materials/food yield scaled by colHands + tech, no ecoHarm) — tuned so risky Expeditions still pay more (tech/special finds). Empty (none) worlds also get a minimal resource-convert so a non-native colony has a trade outlet. Rejected: bespoke colony-only healing/economy systems (more surface area, less coherent with the journey the player already learned)." },
  { date:"2026-06-26", tag:"backlog", title:"Mid-journey ship upgrades (optional hardening) — BACKLOG, post-M-INT2",
    body:"DEFERRED IDEA — build nothing now; recorded so it isn't lost. WHAT: optional ship upgrades bought at the early HUMAN stations (Luna / Mars / Belt / Titan), BEFORE the long stationless Interstellar Void leg — a 'last drydock, nothing past here' point-of-no-return beat. Hardening / efficiency ONLY, never a warp-drive that trivializes the crossing. Candidate upgrades: hull plating (−hazard severity, slower wear; downside +mass → more fuel/turn; synergy: more reactor output via the hull/100 factor + a cheaper Act II refit), reactor tune / coolant (+power headroom; a heat-failure hook), scrubber upgrade (eases the awake-O₂ drain), better pods (cheaper hibernation / less pod-sickness), sensor suite (+hazard & lost-navigation odds), hold expansion. Bought with a MIX — credits + materials/parts + station time + an awake Engineer to install. WHY: gives credits/materials a durable sink; turns the early stations into a real preparation arc; deepens the Engineer role; the ship you harden is the ship you LAND → lower structuralDebt + a cheaper return refit (a genuine mixed-horizon Act II hook reaching all the way to the colony and the voyage home). COST / GUARDRAIL: it is an EASING, so it must stay OPTIONAL margin (a raw, un-upgraded crossing is still winnable) and be re-swept against the Settler / Pioneer / Voyager win-rate gradient. SEQUENCING: a Phase-1 enhancement, built AFTER Act II delivers (post-M-INT2). STATUS: backlog / deferred." },
  { date:"2026-06-26", tag:"feature", title:"P2-M6 — Foothold transition + Settlement victory (Game A is finally winnable)",
    body:"The colony had no win — three lose conditions and a stage hard-set to 'survival' that never advanced. P2-M6 closes Game A. The colony now progresses survival → foothold → settled, gated by SURVIVAL STABILITY rather than a timer: colonyStageCheck counts a stability streak (col._stable) of seasons where nothing is in crisis, every survival axis is comfortably off the floor (≥50), and hope holds (≥45); any backslide resets the streak to zero. Once the streak clears the gate the colony AUTOMATICALLY reaches a 'foothold' — no longer just surviving — and a one-time narrative beat (⚖ The future) fires on the player path, framing what a foothold makes possible. Becoming a thriving, growing SETTLEMENT is the colony's standalone victory, and per the locked decision it is PLAYER-CONFIRMED: when growth + sustained prosperity are met (infra/tech high, every axis ≥60, hope ≥60, a longer streak) the colony becomes settledEligible and a green 'you could call it founded' banner + an enabled 'Found the settlement' choice appear — but the game NEVER ends on its own; you choose the moment, and a confirm step guards the irreversible claim. All the thresholds scale by difficulty through a new colWinBar(base) helper — the inverse of tierThreshold, so a harder tier sets a HIGHER bar (Settler ×1.0, Pioneer ×1.12, Voyager ×1.3); exact numbers are flagged for the M-INT2 balance sweep. The win flows through the existing plumbing untouched: confirmSettlement calls finishColony(true,'SETTLED',cause) → tryCompose → the colony-only composeEnding branch → endGame, so no ending code changed (and a allied-natives clause enriches the cause). Headless-safe by construction: the foothold beat only opens when !auto, and settled eligibility NEVER auto-wins (only the player's confirm calls finishColony(true)) — so the parallel/auto front can flip to foothold and log it but can never silently end the game on a settlement. Game B (colonyLaunch / the voyage) stays intact and dormant — the real Stay/Launch/Split Decision is P3-M1. Verified: node --check game.js audio.js; applyOutcome/resolveCheck md5-identical to HEAD (zero-diff gate); new colonym6 harness (24 assertions: stable colony reaches foothold + the beat fires, low-hope colony stays in survival, the streak builds-then-resets when an axis drops below the floor delaying foothold, growth becomes eligible while pure-survival never does, no auto-win while eligible, the full ⚖→⭐→confirm path yields the SETTLED end screen, the win choice is disabled before eligibility, headless auto flips to foothold with no modal and never auto-wins, v7 round-trip with a stale v6 blob ignored); a smoke confirming a sound growth policy REACHES SETTLED on Settler (10 seasons) while Voyager needs materially more (14) — the gate scales; colonyskel + colonym2 + colonym3 + colonym4 + colonym5 + Phase-1 feattest + fuzz all green; zero JS errors. GAME A DELIVERED — landfall → survival → foothold → settled victory (or death) is playable end-to-end." },
  { date:"2026-06-26", tag:"decision", title:"P2-M6 — Settlement victory is player-confirmed; the foothold is a beat + flag, the real Decision waits for P3-M1",
    body:"Two scoping calls closing Game A. (1) The SETTLED win is PLAYER-CONFIRMED, not automatic: meeting the survival-driven growth thresholds makes the colony 'eligible' (a thriving banner + an enabled 'Found the settlement' choice), and the player presses it — guarded by a confirm — to claim the win. A builder can keep playing past eligibility; the game never ends out from under them. Rejected: an auto-win the instant thresholds are met (steals the player's agency over when their story ends, and would clash with the parallel-front model where an off-screen colony could silently end the game). (2) The foothold transition is a BEAT + FLAG ONLY this milestone: P2-M6 sets stage→foothold, footholdReached, and a one-time narrative ⚖ The future modal that TEASES the road home, but the real Stay / Launch Home / Split-the-crew Decision and the crew split are deferred to P3-M1 (the hinge into Game B). Rationale: building the Decision now would bleed P2-M6 into Game B and blow the one-session budget; a flag + a teased affordance is the clean seam. Game-A delivery gate: after this, reconfirm direction with Tom before P3-M1." },
  { date:"2026-06-26", tag:"feature", title:"P2-M5 — Life on the planet: the native arc (the world that watches back)",
    body:"When you land on an inhabited world, it is finally a living political system, not a flat 'Native stance' bar. The keystone is a small extension to applyColonyOutcome (the colony sibling — applyOutcome stays byte-identical, verified zero-diff): it now applies nativeTrust, defense, and the standing/standingS ending-fork fields, so every native interaction routes through one place. nativeTrust — declared since P2-M1 but a dead field until now — becomes fully live with writers AND readers in both directions (closing the M-INT2 orphan-meter gap). How you met the unknown out in the dark seeds how these natives meet you here: seedNativeStance maps the Phase-1 alien posture to welcoming / indifferent / hostile starting relations, trust, and defense. A single 🤝 Contact season action opens a hub — Trade (goods → +stance, slow +trust), Share medicine (big +trust), Parley (Xenobiologist check → +trust/+tech), Seize a site (take the ground, crater trust, scar the land), or Drive them out. relations is the fast visible surface; nativeTrust the slow hidden anchor it gravitates toward ≤2/season — one fair trade is felt today, but only a pattern relocates the anchor. A high ecoHarm AND a woken thing (Decision A — honoring the P2-M3 forward declaration: disturbing what the natives hold sacred costs you their trust) slowly bleed that trust. The raid hazard now reads trust too: low trust escalates the raids, high trust pushes their danger negative — the aid that simply doesn't bite. Two new colony actions: Restore/Rewild (8 materials + a season — the ONLY way ecoHarm comes down, per the ledger; no passive recovery) and Fortify (defense's first writer; a wall reads as a threat → small trust ding). The hidden meter pays off by name with a BIDIRECTIONAL twist — 'The Reckoning at the Treeline' fires once, late: at high trust they come out of the forest ranked beside you (allied — defense, food, a new colonist, +hope); at low trust they come for you (hostile — a death, lost food/health, trauma). It's built as two gated payoff entries sharing a p_reckon flag with each gate carrying !p_reckon, so exactly one fires — and per the engineering guardrail the flag is consumed EXPLICITLY (at fire time, and by the wipeout), never as a side effect of writing standing. The aggressive path can go all the way: a won war empties the treeline for good (nativesGone) — the raids stop and so does everything else, locking the dark 'displacers' standing. A lean settlers (overtaken) beat lands too: a one-time 'The Other Camp' merger-vs-rivalry set-piece writing settlerStanding. The three standing fields (nativeStanding / nativesGone / settlerStanding) are persisted for the M-INT1 ending composition to read; this milestone writes them, it does not compose endings or add a colony win (P2-M6 / M-INT1). Verified: node --check; applyOutcome/resolveCheck md5-identical to HEAD; new colonym5 harness (12 blocks: button gating, trade raises both meters and never touches ship state, seize craters them + scars the land, the woke bleed, gravitation ≤2/season both directions with no overshoot, the Reckoning fires once at each extreme with the right standing, Restore is the sole ecoHarm reducer, Fortify writes defense, the wipeout ends the raid threat, settlers merger fires once, headless safety, and a static guard that the new handlers live only in the sibling); 8/8 peaceful Settler native-world survivals; colonyskel + colonym2 + colonym3 + colonym4 + Phase-1 feattest + fuzz all green; zero JS errors." },
  { date:"2026-06-26", tag:"decision", title:"P2-M5 — Contact is a single modal hub; the hostile path can wipe out the natives; settlers stay lean",
    body:"Three scoping calls for the native arc. (1) Contact = ONE 🤝 Contact season action opening a modal hub (trade / share / parley / seize / war), mirroring the Expedition flow, rather than five separate top-level buttons — keeps the already-crowded action row coherent ('things you do with/to them'); Fortify and Restore are plain own-button season actions. (2) The hostile path can WIPE OUT the natives (gut-punch, matching the 'occasional gut-punch' tone): a won war sets nativesGone, suppresses the raid hazard, craters trust, and locks the dark 'displacers' standing — aggression has a terminal, irreversible payoff, not just festering raids. (3) The 'overtaken by settlers' case stays LEAN: a one-time merger-vs-rivalry set-piece + an absorb choice writing settlerStanding, rather than a full parallel settlers arc — relations/nativeTrust stay strictly natives-only. Rejected: separate diplomacy buttons (UI clutter), unkillable natives (blunts the dark fork), a full settlers sub-system (blows the one-session budget)." },
  { date:"2026-06-26", tag:"decision", title:"DECISION A — col.woke feeds the native arc (the P2-M3 forward declaration, honored)",
    body:"P2-M3 set col.woke when an expedition disturbs something and forward-declared that P2-M4/M5 would read it. P2-M4 used it for hazard weight + a hope-unease; P2-M5 now ties it to the natives: on a native world, while col.woke, nativeTrust bleeds DOWN each season — disturbing what the natives hold sacred costs you their trust. Folded into the same per-season gravitation block as the ecoHarm spillover bleed (cleaner than edge-detecting the moment woke flips), difficulty-scaled via tierDecay. This makes 'wake something in the ruins' a choice with a diplomatic price, not just a hazard knob — and gives nativeTrust yet another live reader. Also engineering-guardrail: the o.standing handler sets nativeStanding ONLY and must never auto-consume flags.p_reckon — that flag is set explicitly in the two Reckoning fires and the wipeout, so a stray standing write can't silently burn the one-shot Reckoning." },
  { date:"2026-06-25", tag:"feature", title:"P2-M4 — Colony events, hazards & survival set-pieces (the world gets a voice)",
    body:"The colony stops being a quiet spreadsheet. The three shared event functions are GENERALIZED rather than forked: rollEvent(pool,opts) takes any pool (defaults to the ship's EVENTS), eventWeight reads a number OR a front-aware weight function, and presentEvent(ev,opts) routes a colony event through applyColonyOutcome/resolveColonyCheck instead of the ship's applyOutcome/resolveCheck — the Phase-1 ship path stays BYTE-IDENTICAL (applyOutcome/resolveCheck untouched, verified zero-diff; that was the gate). On top of that machinery: 12 COLONY_EVENTS (a promising seam, tainted water, a lone wanderer, breakdowns, cold snaps, unrest, a quiet good year, a first birth) whose skill checks all run through skillAwake — siblings applyColonyOutcome/resolveColonyCheck target colony state (materials/tech/food/water/meds, survival axes, hope, and the hidden meters) and NEVER game.supplies/game.ship. Four COLONY_HAZARDS (blight, quake, raid, and 'The Land Pushes Back' whose weight + danger READ col.woke + ecoHarm from P2-M3) resolve on the same sampled clean→catastrophic spectrum as the ship's crossings. Three scripted survival set-pieces (The First Night, The First Storm, The Long Winter) intercept the season roll at year thresholds and fire EXACTLY once via a new col.flags map that PERSISTS in the v7 save — a mid-run reload can't replay a set-piece. And every harsh long-tail meter finally pays off by name: ecoHarm→'The Ground Remembers', contamination→'The Fever Season', structuralDebt→'The Long Crack', trauma→'The One Who Couldn't', each fires once when the meter crosses its harsh-scaled tierThreshold. The hook sits in colonyTurn exactly where it should: the event/hazard phase runs AFTER resource consumption and BEFORE the died→hope tally, so event and hazard deaths cascade hope like every other death; a player gets a modal, the headless/parallel path resolves inline through skillAwake with no UI. Verified: node --check game.js audio.js; new colonym4 harness (events fire and touch only colony state, 'The Ground Remembers' fires at the threshold and scales with difficulty/ecoHarm, a set-piece fires once and survives a v7 round-trip, headless auto resolves an event turn clean, 8/8 Settler smoke survivals); colonyskel + colonym2 + colonym3 + Phase-1 feattest + fuzz (60 runs) all green; zero JS errors." },
  { date:"2026-06-24", tag:"feature", title:"P2-M3 — Discoverable map + expeditions (ecoHarm goes live)",
    body:"The colony gains a world to explore. COLONY_SITES + seedColonySites lay down a per-run map (ore veins, hot springs, alien forest, deep ice, ruins, a derelict hull) chosen by what's here — hidden until you Scout them. A new Expedition action sends AWAKE crew to a revealed site for a haul (materials/water/food/tech), at real, LEGIBLE risk: a single pure expeditionRisk(site,crew) computes a named tier (Safe/Risky/Dangerous/Deadly) + rough odds shown BEFORE you commit, and the SAME odds drive the one sampleWeighted roll — what you see is what you roll, no soup. Risk falls with party skill/size, rises with site danger, depletion, and a woken thing. ecoHarm becomes LIVE for the first time: exploiting a site WRITES it (tier-scaled, no passive recovery), and colHabDrain READS it — a scarred world drains every survival axis harder each season. Outcomes route through the real crew model: injury → afflict/health hit; death → killCrew (bonded grief) + the colony hope-drop (aliveBefore now captured before the action so expedition deaths cascade); 'lost' strands the party a season. 'Woke something' sets a persistent col.woke/col.wokeWhat that reads live now (raises future expedition danger + a per-season hope unease) and is declared forward for P2-M4's 'The Ground Remembers' hazard and P2-M5's native arc. Sites deplete at capacity; a Known-world panel shows the map; the headless/parallel path can never start an expedition. Verified: node --check; new colonym3 harness (sites hidden/Scout reveals, awake-only gating, shown==rolled, ecoHarm writer 0→7 + reader drains more, death via killCrew + hope drop, depletion removes a site, woke persists a v7 round-trip and raises later risk, headless stays expedition-free); colonyskel + colonym2 + Phase-1 feattest + fuzz (60 runs) all green; zero JS errors." },
  { date:"2026-06-24", tag:"decision", title:"ecoHarm is not a permanent ratchet — restoration writer lands P2-M5",
    body:"Chosen: P2-M3 ships ecoHarm as write-on-exploit (expeditions) / read-as-survival-drain (colHabDrain), with NO passive recovery — the world stays scarred. To avoid an unwinnable doom-ratchet, a dedicated ecoHarm REDUCER, a Rewild/Restore project (expensive materials + labor + time, the only way ecoHarm comes down), is scheduled for P2-M5 and recorded in the ledger as [P2-M5]; the M-INT2 no-orphan + balance audit will expect a live reducer by delivery. Rejected: passive ecoHarm decay (would undercut the 'world doesn't heal itself' theme) and a permanent ratchet (would death-spiral explore-heavy runs). Tuning guardrail noted for the M-INT2 sweep: keep per-expedition ecoCost modest so a barren world (colHabDrain 1.9) stacking with ecoHarm stays survivable before the P2-M5 reducer exists." },
  { date:"2026-06-24", tag:"feature", title:"P2-M2 — Deterministic colony actions + named-settler stakes",
    body:"The colony skeleton gains its hands. Each season you take ONE deterministic action, and each writes a visible immediate effect AND a hidden long-tail per the locked Consequence Ledger. Secure shores up the weakest life-support system (a lasting +output level, and sanitation drops contamination). Build grows infrastructure/capacity — but building while short on materials forces cut corners → structuralDebt↑ and contamination↑. Research raises tech (which eases per-head consumption, loosening the squeeze) and lowers contamination as you learn to live safely on the world. Tend lifts hope and settles trauma. Refit advances the return ship's readiness — and structuralDebt TAXES the refit, so corners cut early visibly slow leaving later (the ledger's 'strip/rush now taxes leave later' cascade). Hold rests the season. Named, bonded settlers (Colonists) now come down with you at landfall — their deaths are personal: a death drops colony hope and grieves bonded partners via the existing crew/bond model. No events, sites, or native arc yet (P2-M3…M5). Verified: node --check; new colonym2 harness (every action moves its visible + hidden meter, structuralDebt taxes refit, settlers arrive bonded, deaths drop hope) green; P2-M1 skeleton harness, Phase-1 feattest + fuzz (60 runs) all clean; zero JS errors." },
  { date:"2026-06-24", tag:"feature", title:"P2-M1 — Arrival seed reader + colony skeleton (clean sheet)",
    body:"First build of the reimagined Phase 2. The old thin colony sim (Game-A internals: colonyRates/colonyAction/applyColonyFocus/colonyScarcity/COLONY_EVENTS/event machinery/colonyBeacon/old renderColony) is replaced by a clean skeleton; Game B (the launch/voyage path) is left intact but dormant, rebuilt in P3-M1. The colony now reads the Phase-1 end state as a seed (surviving crew + roles, ship hull, leftover supplies, dest.habitResult/inhabited/knowledge, alien.*, earth.status, potential/posture, difficulty) and a plain-language LANDFALL briefing states how that seed shaped the run. Core loop: a survival spine (air/water/food/warmth/health) each produced by a manned, powered system and drained by the colony's mouths × habitability; power+hands can't run all five at once, forcing brownout triage (reused shed-load pattern); an empty axis escalates Phase-R style into health + hope damage (and settler deaths for food/water), and a sustained collapse / hope 0 / last colonist ends the run. ALL meters — survival spine, hope, elapsedYears, and the hidden ecoHarm/nativeTrust/contamination/structuralDebt/trauma + relations/shipReadiness/beaconHeard — are declared up front so later milestones wire to a stable contract; the passive-decay and DIFFICULTY.harsh tier-scaling helpers are live stubs. The colony turn runs headlessly (colonyAutoStep → colonyTurn(true)) for the future parallel front. No colony actions, events, sites, or native arc yet (P2-M2…M5). SAVE_KEY bumped v6→v7 (old saves cleanly ignored). Verified: node --check game.js audio.js; new colonyskel jsdom harness (seed→briefing→colony, stabilize vs escalating death, brownout, v7 round-trip, headless auto-step) green; Phase-1 feattest + fuzz (60 runs) clean, zero JS errors." },
  { date:"2026-06-24", tag:"build", title:"P2-M0 — Act II Consequence Ledger locked (design, no game code)",
    body:"Act II (Arrival/Colony + Voyage Home) is being rebuilt clean-sheet as two games seeded by Phase 1. Per the orchestrator review, the Consequence Ledger is locked FIRST as a design doc (docs/consequence-ledger.md) so every later milestone wires consequences against one consistent contract — avoiding the prior failure where back-half prompts promised mechanics the code never implemented. Defines the survival spine + visible hope/Earth-clock, and five HIDDEN long-tail meters (ecoHarm, nativeTrust, contamination, structuralDebt, trauma), each with writers, readers, thresholds, and a NAMED dramatic payoff event (The Ground Remembers, The Reckoning at the Treeline, The Fever Season, The Long Crack, The One Who Couldn't). ~30 action rows map each choice to its immediate visible effect AND a hidden long-tail (delayed event + ending beat) — mixed-horizon consequences. Audit gaps closed: contamination and trauma now have concrete payoffs; nativeTrust can RISE via trade/diplomacy (not one-way doom); added missing-action rows (research-shortcut, hibernate-colonists, absorb-settlers, spend-the-ship-as-shelter). Orphan check passes: every hidden meter has ≥1 writer AND ≥1 reader. Next: P2-M1 (arrival-seed reader + colony skeleton)." },
  { date:"2026-06-24", tag:"decision", title:"Going home is optional and resource-gated",
    body:"Chosen: the return voyage is never guaranteed and never the default — you can only launch with an earned ship + materials + provisions (at minimum, enough to reach the first waystation). If you never gather enough, you never go, and a thriving 'settled' colony stands as a complete ending in its own right. Rejected: home as a guaranteed/expected outcome. Reinforces the standalone colony victory and makes leaving a real, costly choice." },
  { date:"2026-06-24", tag:"decision", title:"Act II fronts run in PARALLEL (live colony)",
    body:"Chosen: when you launch home and split the crew, the colony you left keeps running as a second INTERACTIVE front on a shared clock with a focus toggle — not a sampled epilogue. Rejected: sequential (the colony freezes into a snapshot once the ship leaves). Because this is the highest-complexity/highest-fade piece, it is built LAST (milestone M-INT1b), only after the colony and the ship each work solo; the headless/auto-resolve prerequisite is threaded into P2-M1 and P3-M2 up front so it isn't a retrofit." },
  { date:"2026-06-24", tag:"decision", title:"Generations on the way home: real-but-minimal",
    body:"Chosen: reuse the existing ageCrew/pregnancy systems for one concrete payoff — a child born in transit matures mid-crossing and takes a crew station, changing who actually arrives at Earth. Rejected: flavor-only text with no mechanical effect. Keeps the generational theme real without a large new subsystem." },
  { date:"2026-06-24", tag:"decision", title:"Consequence Ledger locked before any Act II code",
    body:"Chosen: produce the ledger as a design doc first (P2-M0), then wire each consequence in the milestone that creates its feature. Rejected: build the ledger incrementally during implementation (the documented prior failure mode, which left meters and payoffs half-wired). Every hidden meter must have a live writer AND reader before its milestone is 'done', enforced again at the M-INT2 audit." },
  { date:"2026-06-24", tag:"decision", title:"SAVE_KEY bumped v6 → v7 for Act II",
    body:"Chosen: bump the save key on the Act II state-schema change, which cleanly ignores (wipes) an in-progress v6 run. Rejected: migrate old saves. Acceptable under the game's permadeath/single-slot model and consistent with prior version bumps." },
  { date:"2026-06-23", tag:"feature", title:"Command succession — play on as a survivor when you die",
    body:"When the player-character died mid-run the game just continued with 'you' marked on a corpse (control was never gated on the PC being alive). Now the player is tracked by name (game.youName, not role), and the moment your character dies while crew remain, a forced 'COMMAND PASSES' choice offers each living crewmate — pick one and the run carries on through their eyes, the 'you' (*) marker moving to them. Works on the outbound ship, the colony, and the homebound ark; only fires on the front your character is actually on (so a parallel front you've left is unaffected); newborns are skipped as candidates unless they're truly all that's left; and podding-yourself-then-dying cleanly drops autopilot. Scoring still uses your original chosen class, so succession can't be used to game the multiplier." },
  { date:"2026-06-23", tag:"feature", title:"Homebound voyage given real depth + jobs/cargo fixes",
    body:"Three player-reported issues plus the lackluster ride home. (1) Recruits 'didn't always show up': addCrewMember silently no-ops at MAX_CREW (8) but the code still charged the cost and logged 'they join the crew' — now it says plainly there's no berth instead of lying (ship and homebound voyage). (2) Bland jobs: the 5 fixed templates became a larger flavored pool sampled to vary per visit, with role/zone gating, varied rewards (parts/medicine/fuel/cargo/knowledge/morale, not just credits), real failure stakes (hull risk on salvage), and distinct narration — plus the long-planned COURIER job (carry a sealed crate to a later port for a deferred payout; occupies hold; sometimes 'hot' = seized + fined on arrival). (3) Sellable ore was invisible: the travel HUD now lists carried commodities (and any courier crate), and the trade screen always shows a 'Cargo to sell' section with a hint when empty. (4) The voyage home was 3 buttons and 7 events; it now has the same strategic levers as the outbound leg — Cold Sleep/Pods (the key lever for stretching finite air & food across a decades-long haul), Rest & repair, and Scavenge — and the event pool nearly doubled (stellar flare, lost in the deep, a word from home, the long dark, micrometeoroids, a child born on the road), with a graceful birth that respects the crew cap." },
  { date:"2026-06-23", tag:"feature", title:"Colony redesign: self-sufficiency is now emergent",
    body:"The colony side didn't make sense: two overlapping control systems (toggle 'sectors' AND a yearly 'focus') produced the same resources; the win meter (self-sufficiency) was a separate number you pumped via Research/Build while the food/water economy was just a parallel fail-track; 'Build' was abstract (habitats did nothing); and two HUD meters (Defense, Knowledge) were wired to nothing while the colony opened in an unexplained brownout. Rebuilt around ONE lever and an emergent goal. The colony now runs an AUTOMATIC economy — built infrastructure × tech × habitability produces food/water/materials each year, and the people eat. Self-sufficiency is DERIVED from whether the colony actually sustains itself: a real surplus (with a stores buffer) makes it climb and banks a 'stable year'; breaking even barely creeps; a deficit erodes it. You take root only at 100 held for ≥3 straight years — earned by the economy, not pumped. The single yearly lever is where you invest: Build (materials → infrastructure + population cap + capacity — real habitats), Research (tech → multiplies every yield, replacing the dead Knowledge meter), Survey, Tend, Fortify (now actually feeds a wired Defense that lowers raid difficulty), Diplomacy. The redundant sector toggles, the Power/allocate screen, and the duplicate Farm action are gone; overcrowding (pop > what infrastructure supports) replaces the brownout intuitively. Habitability carried from the journey sets the opening difficulty (verdant thrives, barren fights for every year), and the knowledge you gathered en route seeds starting tech. SAVE_KEY bumped v5→v6 (old colony-shaped saves cleanly ignored)." },
  { date:"2026-06-23", tag:"feature", title:"Prompts now tell the truth: role bonuses + beacon implemented",
    body:"A prompt-vs-outcome audit found a cluster of player-facing promises the code never delivered — chiefly the role descriptions and the colony beacon. Rather than reword them, the mechanics were built so the prompts come true. Commander: a morale FLOOR (awake crew can't sink below 6 while a living, awake Commander leads) plus a tie-BREAK (a check that just misses, diff−roll ≤ 4, flips to success once) in ship/colony/voyage checks. Engineer: repairs cost fewer parts (divisor scales with skill) and hull wears slower (skill-based chance to negate a wear point). Medic: a skilled Medic sometimes treats WITHOUT spending a dose ('stretches the dose'). Pilot: lost ground/time at wormholes and crippling hazards is clawed back (pilotMitigate). Xenobiologist: the Impossible Signal event gains a 'Decode the pattern' skill check (knowledge + foreshadowing). Beacon: sending it now records whether Earth was still live, and a HEARD beacon changes the finale — when both physical fronts fail it becomes a bittersweet partial WIN, 'THE WORD GOT THROUGH', instead of EXTINCT. Plus honest-text nits (contraband label notes the fine, parley flavor acknowledges the credits paid, self-pod warning mentions the auto emergency wake)." },
  { date:"2026-06-23", tag:"decision", title:"Hold cap 240 → 300 (start-of-run breathing room)",
    body:"The hold pinch was at launch: a winnability-tuned Settler load already sits ~201/240, leaving almost no room to top up. Medicine is hold-exempt, so the squeeze was purely fuel+O₂+food+parts+charges+ore. Raising HOLD_MAX to 300 leaves ~100 free at a Settler launch and real room to carry an ore haul, while keeping a genuine triage limit. Pioneer/Voyager launch lighter, so they're unaffected. Win-rate sweep re-run to confirm the Settler/Pioneer/Voyager gradient stays sane after the role buffs + beacon + hold bump." },
  { date:"2026-06-19", tag:"decision", title:"Locked 7 design decisions",
    body:"Tone = comedic-with-gut-punch; crew = personalities/morale/bonds; length = long roguelike permadeath; astronomy = semi-plausible; audio = retro SFX only; route = fixed trail with roguelike feel; resources = Out-There-style interdependence." },
  { date:"2026-06-19", tag:"decision", title:"Power as the hub resource",
    body:"Reactor output = base × (hull/100). Every system draws power; demand over output triggers a brownout/load-shed decision. This makes earlier hull damage cascade into later oxygen crises — the core depth engine." },
  { date:"2026-06-19", tag:"decision", title:"Tech: split vanilla files, no build, retro terminal",
    body:"index.html + style.css + game.js + audio.js. Opens directly in a browser; no bundler. Green-phosphor CRT homage to the original Oregon Trail." },
  { date:"2026-06-19", tag:"build", title:"Scaffolded all files + CRT theme",
    body:"HTML screen containers, full retro stylesheet (scanlines, flicker, blinking cursor), Web Audio SFX module." },
  { date:"2026-06-19", tag:"feature", title:"Core loop + power + crew + events + meta",
    body:"Implemented the full Oregon-Trail-in-space loop: outfitting store, 10-stop trail, turn loop with resource interdependence, 5-role crew with morale/bonds/breakdowns, ~16 events, 3 hazard crossings, hibernation, asteroid-mining mini-game, autosave/permadeath, scoring + rank ladder." },
  { date:"2026-06-19", tag:"fix", title:"updateTopbar crash on role/store screens",
    body:"Topbar read waypoint data before waypointIndex existed. Restricted the nav readout to the travel screen." },
  { date:"2026-06-19", tag:"decision", title:"Balance: reactor base 16 → 20, hull wear 0–2 → 0–1",
    body:"Early playtests showed a guaranteed late-game brownout death spiral. Eased reactor pressure so careful play is winnable while careless play still dies — verified by automated playthroughs." },
  { date:"2026-06-19", tag:"build", title:"Verification: syntax + jsdom playthroughs",
    body:"node --check on both scripts; jsdom harness drives full runs. Win-aware run wins 6/6 (up to FOUNDER OF PROXIMA); careless runs produce a healthy win/loss mix with zero JS errors." },
  { date:"2026-06-19", tag:"build", title:"Initial import landed on main",
    body:"Repo was created empty with no base branch; pushing an empty main was blocked by policy. Per user decision, the first import was placed directly on main via the GitHub API. Future changes branch off main and open a reviewable PR." },
  { date:"2026-06-19", tag:"decision", title:"Animations: per-turn transit + arrival vignettes",
    body:"User asked for Oregon-Trail-style between-scene motion and a visible waypoint map. Chosen: a short, skippable starfield flyby on every Continue, richer docking/hazard/landing vignettes at waypoints, plus a multi-waypoint route map. Includes an ANIM toggle and reduced-motion respect; animations resolve synchronously when off so tests/a11y are unaffected." },
  { date:"2026-06-19", tag:"decision", title:"Alien life is now a scripted surprise",
    body:"Previously an 'Alien Probe' event fired casually, implying we already knew we weren't alone. Now ALL alien content is gated behind a one-time, unpredictably-timed FIRST CONTACT reveal in deep space (the Interstellar Void), preceded only by ambiguous foreshadowing that never confirms life. Human station trade is unchanged." },
  { date:"2026-06-19", tag:"feature", title:"Route map + transit animation engine",
    body:"renderRouteMap() draws all 10 waypoints as icon nodes with visited/current/future state and a live ship marker. playTransit() runs skippable cruise/dock/hazard/land scenes (parallax starfields), wired into onContinue and waypoint arrivals; idempotent finish, overlap guard, synchronous when disabled." },
  { date:"2026-06-19", tag:"feature", title:"First contact + alien parley/trade",
    body:"Scripted FIRST CONTACT modal (Hail / Observe / Run dark, each with consequences) flips a contact flag; events carry req:preContact|postContact so foreshadowing stops and alien encounters + a risky alien trade event unlock only after the reveal. Kept undocumented in the README to preserve the surprise." },
  { date:"2026-06-19", tag:"build", title:"Verification: feature + animation tests",
    body:"jsdom checks confirm the route map renders 10 nodes + ship, FIRST CONTACT fires once in deep space, no alien content appears before it (6/6), post-contact alien events unlock (5/6), and the animation overlay shows + a Space-skip advances exactly one turn. Win/loss playthroughs still pass with zero JS errors." },
  { date:"2026-06-20", tag:"decision", title:"Probabilistic engine: outcomes are sampled, not scripted",
    body:"Per the user, the game is a random-event generator with influence math. Choices nudge a hidden mission 'potential' and posture axes (explore/aggress/persist/cooperate/caution); big resolutions — events, hazards, first contact, arrival — are rolled against those bent odds. Good play raises the odds, never to certainty. Disposition is shown qualitatively; numeric odds stay hidden." },
  { date:"2026-06-20", tag:"decision", title:"Arrival at Proxima is the MIDPOINT, not the win",
    body:"Reaching PCb resolves a sampled situation (habitability; already-inhabited; overtaken by a faster expedition) and offers colonize-and-signal vs return-for-more. A sampled Act II epilogue then yields a tiered ending — Haven / Foothold / Messenger / Withered / Barren / Too Late / Lost — so arriving is necessary, never sufficient." },
  { date:"2026-06-20", tag:"feature", title:"Stakes & scarcity: hold cap, real crew, lethal hazards",
    body:"Added an enforced cargo hold (no more buying safety); rescued people join the crew as real mouths-and-hands; starting credits/supplies cut; hazards rebuilt on a sampled severity spectrum that can kill crew or end the run; self-hibernation drops the ship to a high-risk autopilot." },
  { date:"2026-06-20", tag:"feature", title:"First contact reworked to Fight / Flight / Freeze",
    body:"Fight → they retaliate (chance of repel + tech, or destruction). Flight → they pursue (recurring hostile events until shaken). Freeze → highest variance: commune / ignored / experiment / annihilate. Sets a persistent alien standing that colors later events and the endings." },
  { date:"2026-06-20", tag:"fix", title:"Brownout soft-lock + hull death-spiral",
    body:"A deep brownout (reactor output below life-support draw) could never be satisfied → infinite lock; and the brownout penalty hit hull, feeding a hull→output→brownout spiral. Now you can always proceed under brownout, and the penalty hits AIR not hull, breaking the loop." },
  { date:"2026-06-20", tag:"build", title:"Rebalance + verification (Phase 1)",
    body:"Tuned thrust/distances/hold/supplies so a disciplined run (hibernate, reduced rations, repair) reaches Proxima and wins on Settler while careless play reliably dies. jsdom suite green: route map, F/F/F gating, hold-cap enforcement, lethal hazards, arrival flow, animation skip — zero JS errors." },
  { date:"2026-06-20", tag:"fix", title:"Self-audit fixes (Phase 1)",
    body:"Audited the Phase-1 code and fixed: (1) station trade ignored the cargo cap (could overfill the hold) — now enforced like the store/mining; (2) destination knowledge was collected but unused — now genuinely tilts arrival habitability and softens the 'overtaken/inhabited' surprises; (3) starting supplies nearly filled the hold, making outfitting vestigial — baseline lowered so loadout choice matters; added a hold readout to the store and removed dead variables." },
  { date:"2026-06-20", tag:"decision", title:"Spread the difficulty tiers",
    body:"Per the user, difficulty should span a real easy→hard range rather than being brutal everywhere. Re-tiered Settler (forgiving: more credits/supplies, gentler), Pioneer (the intended balance), and Voyager (brutal), tuning starting credits/supplies, harshness, and starting 'potential'." },
  { date:"2026-06-20", tag:"feature", title:"Phase 1b economy relief valves",
    body:"Mining now yields sellable commodities (ice/ore/volatiles/rare metals); stations buy/sell at LOCATION-BASED prices (fuel & O₂ pricier the farther out, ore worth more in the deep), enabling buy-low/sell-high. Added skill-gated outpost jobs (repair, clinic, survey, contraband-smuggling with 'heat', and a sure-pay haul) so a broke crew can earn out. Stations are now a re-openable hub." },
  { date:"2026-06-20", tag:"feature", title:"Engine depth: potential & posture felt mid-game",
    body:"Hidden 'potential' now adds momentum to skill checks and hazard danger (a run going well/badly compounds); crew posture weights which kinds of events surface (aggressive→confrontational, exploratory→discovery, etc.); occasional qualitative omens let potential be felt without showing the number." },
  { date:"2026-06-20", tag:"fix", title:"Scrubber O₂ could overfill the hold",
    body:"While hibernating, scrubber recovery exceeds consumption, and recovered O₂ wasn't capped to the hold — so oxygen could creep past capacity. Surplus O₂ now vents to space. Verified: across 90 runs the hold is never exceeded." },
  { date:"2026-06-20", tag:"build", title:"Per-difficulty balance verification (Phase 1b)",
    body:"New jsdom sweep plays a disciplined strategy (hibernate, reduced rations, sell ore, take jobs, repair) across all three tiers: Settler ~70%, Pioneer ~50%, Voyager ~20% wins over 30 runs each, zero hold overflows, zero JS errors. Feature/anim/smoke suites still green." },
  { date:"2026-06-20", tag:"decision", title:"Aesthetic pivot: green CRT → starship bridge",
    body:"Per the user, the look moves away from the pure Oregon-Trail green terminal toward a small Star Trek / Star Wars bridge feel. The green terminal survives only as the comms log's heritage." },
  { date:"2026-06-20", tag:"feature", title:"Phase 2: bridge re-theme",
    body:"Full style.css overhaul to an LCARS/holographic palette (deep space blues, holo cyan, LCARS amber/gold, alert red): rounded accent-bar panels, pill buttons, glowing bars, a holographic nav viewscreen for the route map, crew-station rows, bridge-styled modals and mining/transit viewscreens, and a RED-ALERT frame state that pulses when the ship is in real danger. All class/id hooks preserved; feature/anim/smoke suites and the difficulty sweep still pass with zero JS errors." },
  { date:"2026-06-20", tag:"feature", title:"Phase 3: generational crew",
    body:"The voyage is decades long: crew now have an age that advances each turn, while hibernation nearly stops biological time — so whoever stays awake to fly grows old as the sleepers arrive young. Mid-voyage pregnancies produce a child (a new mouth at half-consumption) who, after a compressed childhood, comes of age and takes a crew station; elders can die of old age and their skill declines. The crew that arrives is not the crew that left." },
  { date:"2026-06-20", tag:"build", title:"Phase 3 balance + verification",
    body:"Tuned aging (rate, fertility window, child-maturation speed) so the generational arc is felt without wrecking balance: across runs, births occur ~40% and a child comes of age ~17%. Re-swept difficulty (Settler ~60% / Pioneer ~55% / Voyager ~35%); feature/anim/smoke green; save key bumped to v2 so pre-aging mid-run saves are ignored cleanly. Zero JS errors, zero hold overflows." },
  { date:"2026-06-20", tag:"feature", title:"Phase 6: interactive Act II (roadmap complete)",
    body:"Reaching Proxima is now truly the midpoint: the colonize-or-return decision opens a PLAYABLE second act instead of a sampled epilogue. STAY/MAKE CONTACT begins an interactive colony loop — build (self-sufficiency), farm (food), explore, tend the people, and (with natives) diplomacy, across years of storms, disease, raids, gifts, births, and possible reinforcements from home; win by reaching self-sufficiency 100, lose to starvation, unrest, or hostile natives. RETURN begins an interactive homeward voyage — push/steady/scavenge across legs with encounters (faster ships overtaking you, the alien pursuer, fold-shortcuts) and an Earth that may be thriving, too late, or gone. New colony/return screens and routing; all test harnesses updated to drive Act II. Initial colony economy was too punishing (Settler 47%); eased yields/upkeep/events to restore balance (Settler ~57 / Pioneer ~50 / Voyager ~23). Fuzz clean, suites green. The six-phase roadmap is complete." },
  { date:"2026-06-20", tag:"feature", title:"Phase 5: wormholes & Earth's fading signal",
    body:"Rare, optional wormholes appear in deep space: a gamble that can shortcut a huge distance, fizzle, fling you off course (you then burn time/fuel re-localizing), or nearly tear the ship apart. They are navigable on purpose only with hard-won knowledge or alien tech — and never a sure line to Proxima (a shortcut can't deposit you at the destination). Meanwhile Earth's signal fades from live to faint to (often) silent — a late gut-punch that hits morale and reshapes the endings: a silent Earth makes 'return' mostly grief and makes a colony 'all that is left of us.' Verified: wormholes fire ~85% of runs (shortcut vs lost both occur), Earth goes silent ~65%; fuzz clean; balance restored after softening the morale tax (Settler ~60 / Pioneer ~53 / Voyager ~23). Save key v4." },
  { date:"2026-06-20", tag:"feature", title:"Phase 4: ATLAS, the ship mind",
    body:"Added a shipboard AI, ATLAS, whose core integrity decays each turn — faster the fewer minds are awake (the lonely void frays it). Stable (>60%) it assists skill checks and hazards and occasionally optimizes systems; degrading (28-60%) it glitches (false gauges, rogue power reroutes, eerie unease); hostile (<28%) it turns antagonist — locking life support or the drive, venting stores, and endangering crew. The Engineer can run diagnostics to restore it, or attempt a risky, irreversible purge. Verified: a long neglected run degrades ATLAS to single digits and through glitch→hostile; 60-run fuzz (incl. the AI menu) clean; balance re-swept (Settler ~53 / Pioneer ~53 / Voyager ~20 with maintenance). Save key bumped to v3." },
  { date:"2026-06-20", tag:"fix", title:"Audit pass (Phases 1-3): fuzz + manual review",
    body:"Added a randomized fuzz harness (120 runs across all roles/difficulties, hammering store/trade/jobs/power/hibernation/mining/autopilot). It caught a real crash — the mining mini-game read mg.over/mg.time after teardown — now guarded. Manual review found and fixed two more bugs: skillFor returned the LAST matching crewmate (so a hibernating/low-skill duplicate from coming-of-age could mask a capable specialist) — now returns the best awake specialist; and the Commander's morale benefit was INVERTED (it made crew crack at morale ≤6 instead of ≤0) — now a living, awake Commander genuinely lowers breakdown odds and eases recovery. Removed dead constant; verified save/resume across a reload. Fuzz clean, suites green, balance holds." },
  { date:"2026-06-20", tag:"fix", title:"Audit pass (Phases 5-6): Act II save/resume",
    body:"Audited the newest Act II code and fixed three bugs that broke persistence of the second half. (1) Resume always forced the saved game back to the travel screen — so reloading mid-colony or mid-return dumped you into space instead of your colony/homeward voyage; resume now restores the saved screen (travel/colony/return) with a whitelist fallback. (2) colonyAction and returnAction never called save(), so progress through Act II wasn't autosaved between turns — both now save each turn. (3) beginColony didn't wake hibernating crew on landing, so sleepers could be miscounted while still listed Hibernating — landing now wakes everyone. Verified with a deterministic resume harness (mid-colony, mid-colony-without-natives, mid-return, and a bogus-screen fallback all resume to the correct screen with zero JS errors); feature/smoke suites and a 60-run fuzz all clean." },
  { date:"2026-06-22", tag:"fix", title:"Stop offering fixes by dead/asleep specialists",
    body:"Playtest report: events, hazard crossings, and the ATLAS menu offered role-locked fixes (e.g. 'Recalibrate the core [Engineer]') even when that specialist was dead or hibernating — the option would then silently resolve at a heavy penalty. Station jobs already filtered for living/awake crew; events/hazards/ATLAS did not. Added hasAwakeSpecialist(role); role-locked options whose specialist is dead or asleep are now disabled when a real alternative exists, and relabeled '— none aboard' (kept as a desperate, penalized last resort only when they are the single option, so no event can soft-lock). openModal now ignores clicks on disabled buttons. Verified: a fabricated run with Engineer/Medic/Pilot dead never offers an enabled dead-role fix; single-choice events relabel correctly; fuzz clean, zero JS errors.",
    impact:"events / hazards / ATLAS UI" },
  { date:"2026-06-22", tag:"note", title:"Abduction is not a crew-count bug (presentational)",
    body:"Playtest report that aliens 'take a crew member but there's no less members.' Traced every 'taken' path (FREEZE→experiment and the autopilot-during-contact branch): both call killCrew, and a 1,900-run harness logged 169/169 abductions correctly reducing the living count — zero misses. The real issue is presentation: a taken crewmate is encoded as 'Dead' and stays in the roster as a struck-through row, so the list doesn't visibly shrink. Candidate follow-up: a distinct 'Taken/Missing' status, or collapsing fallen crew in the roster." },
  { date:"2026-06-22", tag:"note", title:"Strategy probe: trip length dominates win rate",
    body:"A policy-driven harness (16 strategies, isolating one lever each, ~1,900 runs/difficulty) found that on Settler the Overdrive-thrust strategy won ~50% while every other strategy sat at or below ~18%. Because life-support (food/oxygen) is consumed per TURN over a fixed distance, faster thrust shrinks the consumption window far more than its extra fuel cost hurts — making 'go as fast as possible' close to a dominant survival strategy that swamps the richer levers (first contact, hazards, AI upkeep). Flagged as a balance issue to address (e.g. steeper fuel/power cost or per-distance consumption)." },
  { date:"2026-06-22", tag:"balance", title:"Per-distance life support kills the overdrive exploit",
    body:"Acted on the strategy probe: oxygen and food are now consumed per DISTANCE rather than per turn (a pace multiplier = thrust speed / cruise speed scales both consumption and scrubber recovery each turn). Crossing the same gulf costs the crew the same air and food whether you cruise or overdrive, so high thrust becomes a fuel-and-exposure gamble instead of a way to cheat survival. Cruise is unchanged (pace 1.0). Re-measured: overdrive fell from a runaway ~50% to mid-pack ~28%, and early hibernation became the clear winning lever (~4% without it vs ~30% with) — the rich systems matter again and naive play loses." },
  { date:"2026-06-22", tag:"balance", title:"Forgiveness pass — get wins on the board",
    body:"Competent play was only winning ~30% on Settler (the EASY tier), too punishing. Tuned the difficulty table for a healthier gradient: Settler much more forgiving (credit 1.6→2.0, harsh 0.7→0.5, startMult 1.30→1.60, potential0 58→64), Pioneer eased modestly, Voyager softened slightly but still brutal. Bumped base starting supplies (food 42→50, O₂ 42→46, fuel 22→24) and raised the cargo hold 200→240 to fit the larger loadout (feattest caught the start briefly exceeding the old cap). Re-measuring all three tiers to confirm competent Settler ~55-60% with the gradient intact." },
  { date:"2026-06-22", tag:"feature", title:"Abductions are distinct from death; roster shows only the living",
    body:"Playtest: 'aliens take a crew member but there's no fewer members.' The count was always correct (169/169 abductions dropped it), but a taken crewmate lingered in the roster as a struck-through 'Dead' row. Now killCrew carries a 'taken' flag, the crew strip renders ONLY living crew (so the list visibly shrinks on a loss) with a separate memorial line — '✖ Lost: …' for the dead and '◌ Taken by the unknown: …' for the abducted — and the end screen distinguishes them too." },
  { date:"2026-06-22", tag:"feature", title:"Slight UI animations",
    body:"Cheap, GPU-friendly polish, all respecting prefers-reduced-motion: resource bars glide to new values and critical bars pulse; modals fade and lift in; new log lines slide in and the freshest briefly highlights (wired the previously no-op flashLog); hibernating crew 'breathe' and cracked crew tremble in the roster; ATLAS's readout flickers/glitches when it is degrading or hostile; buttons lift on hover. (The route map already glided its ship and pulsed the current waypoint.)" },
  { date:"2026-06-22", tag:"balance", title:"Curb overdrive + break the death cascade",
    body:"Per-tier measurement showed overdrive still dominant on Pioneer/Voyager (~53-54%) because fewer turns dodge per-turn dangers, and that competent Settler losses were ~81% whole-crew attrition (deaths cascading into morale collapse), not starvation. Two changes: (1) burn/overdrive now cost steeply more fuel and power (overdrive speed 22→16, fuel 4→7, power 6→9; burn 14→12 / 3 / 5) and inflict engine-stress hull wear that scales with thrust, so racing self-limits via fuel starvation and brownouts; (2) bond-death grief and ailment lethality now scale with difficulty (Settler much gentler, Voyager harsher), so a single death is far less likely to spiral the whole crew on the forgiving tiers. Re-measuring the gradient." },
  { date:"2026-06-22", tag:"balance", title:"Final gradient validated — wins are achievable",
    body:"Post-change measurement (70-120 runs/cell): overdrive collapsed from dominant (53-54%) to 0% as a spam strategy on every tier (exploit gone) while still usable tactically; naive/no-rest/no-economy/no-hibernation all near the bottom. The win bottleneck was diagnosed precisely — ~81% of competent Settler losses were whole-crew attrition, and the cause was a SLEEPING MEDIC letting ailments fester: keeping the Medic awake nearly doubled the win rate (49% vs 20%, reached Proxima 65% vs 33%). So ailment management is intended depth, not a balance bug. Final gradient with adaptive play: Settler ~49% (forgiving), Pioneer ~25-34% (real challenge), Voyager ~14-19% (brutal). To help new players get wins, the default difficulty is now Settler, and the how-to + hibernation screen now advise keeping a pilot, engineer, and MEDIC awake. feattest/smoke/fuzz all green, zero JS errors." },
  { date:"2026-06-22", tag:"fix", title:"Act II deepening — Phase R: rigor (starvation teeth + no sleepwalking)",
    body:"First phase of bringing the back half of the game up to the depth of the journey out. Two reported rigor bugs fixed. (1) STARVATION/SUFFOCATION now escalate: at 0 food or 0 oxygen a per-turn counter ramps the health/morale hit (food -6→-30, O2 -14→-46) so neglect spirals the crew to death instead of letting them limp on forever at a flat penalty — verified a 0-food/0-O2 run now ends in ~5 turns, not never. (2) SLEEPING CREW NO LONGER ACT: added skillAwake(role) (best AWAKE specialist, or a 'no qualified hand' floor of 12 — a hibernating or dead specialist contributes nothing) and routed every SILENT skill check through it (auto-medbay, event resolution resolveCheck, first-contact fight/flight/freeze, hazard piloting, rest & repair, colony checks); the return 'pursuer' event now injures only awake crew, never someone asleep in a pod. Menu-gated actions (jobs, ATLAS, event/hazard role options) were already awake-gated. feattest/smoke/fuzz green, zero JS errors. Next: Phase C1 (full colony simulation)." },
  { date:"2026-06-22", tag:"feature", title:"Act II deepening — Phase C1: the colony is now a real simulation",
