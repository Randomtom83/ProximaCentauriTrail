    body:"Completed the back half. C2 — THE MESSAGE HOME: from an established colony you refit the ark ('Ready the ark', costs materials + years to reach 100%), can send a cheap light-speed BEACON anytime as a hedge, and LAUNCH WHEN YOU CHOOSE via a crew-split roster (assign each living crewmate STAY vs RETURN; the ship provisions from colony stores and those people leave the colony's count). C3 — THE VOYAGE BACK is now a real turn loop on its own ship/crew/stores (game.voyage): pace-based fuel/air/food with the same starvation escalation, a power/brownout readout, thrust & rations, a 7-entry VOYAGE_EVENTS pool with real skill-check choices (debris, derelict salvage, alien pursuer, fold-shortcut, sickness, cache, quiet crossing), crew morale/ailments/auto-medbay, and Earth-state-aware arrival endings — replacing the old 6-leg integrity lottery. C4 — PARALLEL FRONTS: the colony and the homebound ship share one clock; advancing the focused front auto-advances the other (its sectors/upkeep/events run unattended and log), with a ⇄ focus toggle, and the finale COMPOSES both outcomes — TWO WORLDS (both succeed) · A WORLD, AT LEAST (colony stands, ship lost) · THE MESSENGER (colony fell, news got home) · EXTINCT (both fail). To support two independent crews the core helpers (awake/alive/skillAwake/killCrew/adjust*/afflict/byName/crewStrip) now take an optional crew array. Save bumped v4→v5. Verified with a dedicated Act II harness (crew-split launch, voyage screen, parallel auto-advance, a composed ending, beacon) plus feattest/smoke/fuzz — zero JS errors. The six-phase Act II deepening (R, C1–C4) is complete: arrival is truly the midpoint, with a real colony, a player-timed departure, and a real ride home." },
  { date:"2026-06-22", tag:"balance", title:"Act II balance re-validation — fixes from the strategy sweep",
    body:"Re-ran the policy win-rate harness through the NEW deep Act II (updated it to drive the colony sim, the crew-split launch, and the homebound voyage). It caught real problems, now fixed. (1) The FREEZE 'annihilate' first-contact outcome was an INSTANT game-over — a ~14%-of-runs unearned coin-flip every game; it's now a survivable catastrophe (heavy hull damage + 1-2 crew lost) with its odds cut and difficulty-scaled. (2) The immediate 'Return at arrival' voyage provisioned from your DEPLETED arrival tanks, so it launched near-empty and won 0%; it now sets out with a real (modest) homeward stock. (3) Starvation/suffocation severity now scales with difficulty so marginal runs on forgiving tiers can recover. (4) Morale collapse must be SUSTAINED (3 turns) to end the run — one rock-bottom turn is a recoverable crisis, not instant mutiny. After fixes, competent Settler rose (21%→26% in a single-policy check with the instakill gone from the death tally); a full Settler/Pioneer/Voyager core sweep is running to confirm the gradient. feattest/smoke/fuzz green, zero JS errors." },
  { date:"2026-06-22", tag:"balance", title:"Act II gradient confirmed + the voyage home made winnable",
    body:"The post-fix sweep confirmed a healthy gradient — competent Settler ~37% (reached Proxima 58%, up from 41% before the despair-grace fix), Pioneer ~22%, Voyager ~7% (brutal, intended); naive/no-hibernation play wins ~0% everywhere. These are CONSERVATIVE numbers: the harness never mines (a major real resupply) and runs a fixed strategy, so a human does better. One more real bug found and fixed: the homebound voyage was effectively unwinnable on its own — the crossing is ~the whole trail again but the ship couldn't carry enough fuel, and the round trip ran so long that Earth almost always went silent before arrival (a near-guaranteed 'TOO LATE'). Fix: provision the ark with a full fuel load, and shorten the homeward leg to ~62% of the outbound trail (you've mapped the route on the way out), so a live-Earth 'MESSENGER' arrival is achievable. The voyage-only 'Return at arrival' choice rose 3%→13% — now a genuine if risky gamble rather than a trap; the light-speed beacon remains the reliable way to get the news home. fuzz/feattest/Act-II harness green, zero JS errors. Balance re-validation complete." },
  { date:"2026-06-23", tag:"fix", title:"Autopilot fast-forwards instead of clicking every turn",
    body:"Playtest report: in self-hibernation autopilot, choosing 'wake only on emergency' still made you press a button every single turn. Added autopilotRun() — the autopilot screen's primary action is now '▶▶ Run until emergency' (or 'Run to next waypoint', matching your chosen wake condition), which advances unattended turns in one click until a wake condition fires (emergency: hull <25 / O2 <10 / one crew left; the chosen waypoint; arrival; or the run ends), auto-handling brownouts (the air pays, since no one's awake to shed load). A '▶ One turn' step and '☼ Emergency wake' remain for fine control. Verified: one click advances ~10 turns and the ship wakes itself on the emergency with the crew alive, zero JS errors; fuzz/feattest still green." }
];

/* ---- rendering + interactivity ---- */
var KEY = "proxima-dashboard-progress-v1";
function loadProg(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }
var prog = loadProg();

function statusOf(sid, idx, def){ var k=sid+":"+idx; return (k in prog)?prog[k]:def; }
function cycle(s){ return s==="todo"?"doing":s==="doing"?"done":"todo"; }

function badge(s){ var m={done:["b-done","DONE"],doing:["b-doing","IN PROGRESS"],todo:["b-todo","TODO"]}; return "<span class='badge "+m[s][0]+"'>"+m[s][1]+"</span>"; }
function boxChar(s){ return s==="done"?"✓":s==="doing"?"▸":""; }

function render(){
  document.getElementById("stamp").textContent = "Last updated: "+LAST_UPDATED;
  var totalT=0, doneT=0;
  var html="";
  SPRINTS.forEach(function(sp){
    var n=sp.tasks.length, done=0, doing=0;
    var rows = sp.tasks.map(function(t,i){
      var st=statusOf(sp.id,i,t[1]);
      if(st==="done")done++; if(st==="doing")doing++;
      return "<div class='task "+st+"' data-s='"+sp.id+"' data-i='"+i+"'>"+
        "<span class='box'>"+boxChar(st)+"</span>"+
        "<span class='label'>"+t[0]+"</span>"+badge(st)+"</div>";
    }).join("");
    totalT+=n; doneT+=done;
    var pct=Math.round(done/n*100);
    html+="<div class='sprint'><h3 data-toggle='"+sp.id+"'><span>"+sp.name+"</span>"+
      "<span class='pct'>"+done+"/"+n+" · "+pct+"%</span></h3>"+
      "<div class='body'><div class='bar mini'><span style='width:"+pct+"%'></span></div>"+rows+"</div></div>";
  });
  document.getElementById("sprints").innerHTML=html;
  var opct=Math.round(doneT/totalT*100);
  document.getElementById("overall-bar").style.width=opct+"%";
  document.getElementById("overall-pct").textContent=doneT+"/"+totalT+" tasks · "+opct+"%";

  // meta cards
  document.getElementById("meta").innerHTML=
    card("Overall",opct+"%")+card("Sprints",SPRINTS.length)+card("Tasks",totalT)+
    card("Log entries",LOG.length)+card("Status", opct===100?"SHIPPED":"BUILDING");

  // log
  document.getElementById("log").innerHTML = LOG.slice().reverse().map(function(e){
    var cls = e.tag==="decision"?"decision":e.tag==="fix"?"fix":"";
    return "<div class='log-entry "+cls+"'><span class='log-date'>"+e.date+
      "</span><span class='log-tag t-"+e.tag+"'>"+e.tag.toUpperCase()+"</span><br>"+
      "<span class='log-title'>"+e.title+"</span><div class='log-body'>"+e.body+"</div></div>";
  }).join("");
}
function card(k,v){ return "<div class='card'><div class='k'>"+k+"</div><div class='v'>"+v+"</div></div>"; }

document.addEventListener("click",function(ev){
  var task=ev.target.closest(".task");
  if(task){ var s=task.getAttribute("data-s"),i=+task.getAttribute("data-i");
    var sp=SPRINTS.find(function(x){return x.id===s;});
    var cur=statusOf(s,i,sp.tasks[i][1]); prog[s+":"+i]=cycle(cur); saveProg(prog); render(); return; }
  var tab=ev.target.closest(".tab");
  if(tab){ var t=tab.getAttribute("data-tab");
    document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("active",x===tab);});
    document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("active",p.id==="panel-"+t);}); }
});
render();
</script>
