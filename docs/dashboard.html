<style>

  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at center,#0a140a,#000 75%);color:var(--green);
       font-family:var(--mono);text-shadow:0 0 4px rgba(51,255,102,.4);padding:24px;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;border:2px solid var(--faint);border-radius:14px;background:var(--bg);
        padding:20px 26px;box-shadow:0 0 38px rgba(51,255,102,.15),inset 0 0 80px rgba(0,0,0,.8)}
  h1{letter-spacing:2px;margin:0 0 2px}
  h2{letter-spacing:1px;color:var(--amber);border-bottom:1px solid var(--faint);padding-bottom:6px;margin:28px 0 12px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:4px}
  .stamp{color:var(--cyan);font-size:12px}
  .tabs{display:flex;gap:8px;margin:18px 0}
  .tab{background:transparent;color:var(--dim);border:1px solid var(--faint);font-family:var(--mono);
       padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;letter-spacing:1px}
  .tab.active{color:var(--bg2);background:var(--green);border-color:var(--green)}
  .panel{display:none}.panel.active{display:block}
  .overall{border:1px solid var(--faint);border-radius:8px;padding:12px 14px;margin:8px 0 4px}
  .bar{height:14px;background:var(--bg2);border:1px solid var(--faint);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--dim),var(--green));transition:width .4s}
  .bar.mini{height:9px}
  .sprint{border:1px solid var(--faint);border-radius:8px;margin:12px 0;overflow:hidden}
  .sprint h3{margin:0;padding:10px 14px;background:rgba(51,255,102,.05);font-size:15px;letter-spacing:1px;
             display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .sprint h3 .pct{font-size:12px;color:var(--cyan)}
  .sprint .body{padding:6px 14px 12px}
  .task{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dotted var(--faint);font-size:13.5px;cursor:pointer}
  .task:last-child{border-bottom:none}
  .box{width:18px;height:18px;border:1px solid var(--dim);border-radius:4px;flex:0 0 auto;text-align:center;line-height:16px;font-size:12px}
  .task.done .box{background:var(--green);color:var(--bg2);border-color:var(--green)}
  .task.doing .box{border-color:var(--amber);color:var(--amber)}
  .task.done .label{color:var(--dim);text-decoration:line-through}
  .task.doing .label{color:var(--amber)}
  .badge{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-left:auto}
  .b-done{color:var(--green)}.b-doing{color:var(--amber)}.b-todo{color:var(--dim)}
  .log-entry{border-left:2px solid var(--faint);padding:4px 0 10px 14px;margin:0 0 4px 4px;position:relative}
  .log-entry::before{content:"";position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  .log-entry.decision::before{background:var(--amber)}
  .log-entry.fix::before{background:var(--cyan)}
  .log-date{color:var(--cyan);font-size:12px}
  .log-tag{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-left:6px}
  .t-decision{color:var(--amber)}.t-feature{color:var(--green)}.t-fix{color:var(--cyan)}.t-build{color:var(--paper)}
  .t-backlog{color:var(--dim)}.log-entry.backlog::before{background:var(--dim)}
  .log-title{font-weight:bold;color:var(--paper)}
  .log-body{font-size:13px;color:var(--green)}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
  .card{border:1px solid var(--faint);border-radius:8px;padding:10px 12px}
  .card .k{color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .card .v{color:var(--paper);font-size:20px}
  a{color:var(--cyan)}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>

var LOG = [
  { date:"2026-07-10", tag:"feature", title:"RE-VISION Phase 2.7 — QoL keys: numbered prompts (digits press choices) and the trading post stays open until you actually leave",
    body:"Tom's ask, both halves: keyboard commands for the prompts (the trading post especially), and a way back into the station if you closed the menu but haven't departed. SHIPPED (input/UX only, zero odds changes, frozen-three md5-identical): (1) NUMBERED PROMPTS — openModal now stamps an amber .key-n chip (1-9) on every button of a multi-choice prompt and the modal key trap maps the digits to them; single-choice modals stay unnumbered; typing fields are exempt. The station menu reads 1 Trade / 2 Work / 3 Rest & repair / 4 Depart. (2) THE PORT STAYS OPEN — arriving at a station sets game._dockedAt (carried in the save); closing the menu or pressing Depart no longer locks you out: the travel console shows 'Return to <station> (s)' and the S key or button re-opens the port through a new handle('station') case. The fresh-arrival business can never re-roll — the contraband fine and courier delivery key off _stationFresh, which is consumed on first entry (proven in-harness by planting heat 99 and asserting credits unchanged on re-entry). resolveTurn clears _dockedAt: one real turn of flight and the port is genuinely behind you; a departed player's S is a no-op. Autopilot is unaffected (it never docks). VERIFIED: new test/station_keys.js (15th harness) drives a REAL arrival at Lunar Gateway via checkArrival, asserts the 4 chips, digit-4 firing Depart, docked persistence, no-fine re-entry, resolveTurn teardown, and the departed no-op; GATE PASS 15 harnesses green; live-browser check at desktop with real keydowns (chips render, 4 departs, Return button appears, S re-opens) — run against the player's own browser with his live Day-29 save backed up first and byte-restored after. Phone-width evidence follows the standing orchestrator sign-off convention." },
  { date:"2026-07-10", tag:"decision", title:"RE-VISION Phase 2.6 — Systems-truth audit: succession, the journey home, the colony machinery, the one-way front switch (audit only; findings routed into a NEW Phase 3.0 + Phase 3/4 amendments)",
    body:"Tom asked for a serious look — not a fix pass — at whether the machinery does what the buttons and fiction promise: taking over a life when you die, the flight home, every colony verb, what power is based on, Scout clickable at 5/5 sites, life support pinned at 100, colonists with no useful skill, research that leads nowhere, and how to switch from the homebound ship back to the colony. Three line-level audits ran against HEAD 6703794. THE SHAPE OF IT: the STRUCTURE is sound (landmark crossings cannot skip or double-fire, tryCompose end-races resolve, split guards hold, stages cannot regress) — the defects cluster in identity, economy leaks, and verbs that lie. SUCCESSION: sound intra-front, broken at the crew split — youName is one global with no notion of fronts, so dying as the last of one front leaves the player inhabiting NOBODY on the surviving front (no prompt, no *); playerChar()'s fallback has no Dead-guard and can rebind you to a corpse; a hibernating heir is never woken (and can end the outbound run next turn); the end screen prints the frozen origin role while the roster * moves. COLONY: a powered, manned life-support axis structurally PINS at 100 (prod always beats use; zero entropy) — the 'everything drains, triage' HUD is false once secured, exactly Tom's report; colonist skill is dead data (read only in one expedition fallback — a colonist is pop with a name); Scout at 5/5 and Refit at 100/post-launch burn a season for nothing (col.year++ precedes every affordability gate); colPower goes decorative once infra>=5 & hands>=5. JOURNEY HOME: Rest/Scavenge advance the colony a full cycle but ZERO ship turns and become completely FREE once the colony resolves — farm a parked ark to full, then cruise; fuel-0 freezes distance while the log says 'coasts on momentum'; the loneliest leg has no Cracked breakdowns and no ATLAS (even beginReturn's same ship); launch provisioning is invisible at commit (~45% of colony food taken, unshown); beaconHeard is written from possibly-frozen BELIEF while arrival resolves on hidden TRUTH. CROSS-FRONT UX (Tom hit it live): the switch is a one-way door — the voyage has 'Tend the colony' but the colony's ark line is inert text; no focus->voyage control exists anywhere. ROUTED: a NEW Phase 3.0 'The machinery tells the truth' lands FIRST in Phase 3 (win-rate sweeps are meaningless while the economy leaks), and Phase 3/4 items gain: colony life-support ENTROPY (3.2), voyage Cracked + ATLAS-rides-home (3.2/3.6), provisioning preview (3.4), popCap/caps/colPower re-tension (3.8), success-line rewrite + pool expansion behind a content-lint harness (3.10), colonists-become-people (4.3), NEW 4.7 research-leads-somewhere (tech thresholds unlock named improvements from the tech bible), epitaph/crew-memory into 4.4. Repo note: M-UI3c (77734b3, homebound-chart orientation) was stranded in the Dropbox clone — reconciled into this line alongside this docs pair. Full line-cited audit: Tom's plan file (i-want-you-to-parsed-diffie)." },
  { date:"2026-07-10", tag:"fix", title:"RE-VISION Phase 2 — Playtest patch-wave: the colony fits on screen, the chart says YOU vs NEXT, and a full ship stops charging for rescues that never board",
    body:"Three defects from Tom's live play, all verified in a real browser before and after. (1) COLONY FIT: renderColony stacked status→crew(296px)→world→VERBS, putting the every-cycle action row at y≈816 in an 800px window — on DESKTOP (travel got the one-screen bridge in M-UI2; colony never did). Fix: verbs-first order (hud + banner + acts + hint + world + crew + log), the colony crew strip bounded with internal scroll (.colony-crew .crew-strip max-height clamp), and at ≤900px decoration yields to controls (.colony-vista and the long .col-hint texts hidden — same posture as M-UI2c's .vs-title hide) plus denser .menu.row buttons holding the 44px touch floor. Measured after: desktop action row bottom 856→465 (above the fold with room); phone 390×844 all 10 season verbs fully visible on the first screen (bottom 842), zero horizontal overflow. layout_onescreen gains assertion (m) pinning verbs-first order + bounded strip + decoration-yield. (2) CHART LEGIBILITY: the pulsing amber 'current' node marks the NEXT waypoint, but it's the loudest thing on the chart so players read it as 'you are here' while the true position (ship glyph + lit-arc end) trails behind. The ship marker now carries a small cyan YOU tag and the destination label reads 'NEXT ▸ name'. Presentation only. (3) FULL-SHIP HONESTY (deliberate frozen-three change — applyOutcome, baseline re-seeded THIS commit, only its md5 moved): recruit now resolves FIRST; when the ship is at MAX_CREW the rescue's rewards (+morale, their credits) no longer apply while shared-supply costs still do — the old order paid +8 morale for taking aboard a person who never boarded. Recruit-bearing event choices now say 'no berths (8/8); you can only share supplies' BEFORE the player commits, and the travel/voyage crew headers read 'Crew (n/8 — full)'. BONUS BUG FOUND IN THE SAME READ: three events promised TOP-LEVEL credits that applyOutcome never handled (distress +90, alien-probe study +260, alien barter −80) — prompts that lied in both directions; o.credits is now honestly applied (suppressed when the payer never boarded). Dynamic life-support-driven crew capacity is scheduled as Phase 4 (Tom's call: fix the defect now, rebuild the cap later). VERIFIED: GATE PASS — 14 harnesses green (layout m-assertions live), frozen baseline updated for applyOutcome alone (resolveCheck/tryCompose md5-unchanged), browser evidence at 1280×800 + 390×844 for colony/chart/headers. Decisions locked with Tom this session, recorded in the plan: beacon → RARE REAL REINFORCEMENT on the physics' timeline (Phase 3); arrival converts the hold into colony founding capital (Phase 3); crew cap → defect now + dynamic capacity Phase 4." },
  { date:"2026-07-10", tag:"feature", title:"RE-VISION Phase 1 — The on-ramp: the game narrates its own kill-chains and every death ends in a post-mortem (run-1 legibility, ZERO odds changes)",
    body:"Tom reopened the whole design ('nothing is sacred') with a North Star — darker, harder, slightly real, still funny — and three calls: genuinely open to reinvention, push darker/harder further, tighten the on-ramp FIRST so new brutality lands on players who can read it. Phase 1 ships the on-ramp. THE PROBLEM (audit D1-2): naive win-rate is 0% by design, but a first-timer dies without perceiving the causal chain the engine fully simulates (hull caps reactor → reactor powers scrubbers → scrubbers make air → suffocation arrives a week after the rock). SHIPPED, all display/recording only: (1) FLIGHT RECORDER SUBSTRATE — chronicle() appends causal FACTS to game.chain (cap 60) at each transition's single point of truth: every killCrew (named, with verb), hull hits ≥15 via a chronHull() watcher (turn loop + travel render, so modal-inflicted damage is caught WITHOUT touching the frozen appliers), brownout onset with the numbers (output/demand/hull), life-support unpowered, anoxia onset + every 3rd turn with a NAMED CAUSE (life support unpowered / reactor shortfall / burning air at pace / more lungs than scrubbers), starvation onset (+rations context), pods-unpowered, despair count, ATLAS turning hostile, fuel exhaustion, chose-to-run-under-brownout. game.firsts marks systems/beats touched (thrust/rations/power/pods/rest/mine/atlas + trade/jobs/wormhole/contact/arrived/colony/decision/beacon/ark) via one-line first() marks at the dispatch cases and beat functions. (2) ATLAS TELEMETRY — atlasTelemetry() narrates band changes in-fiction ('Hull 62% — reactor capped at 12 of 20. Something must go dark.' / 'Net oxygen −5.0 per turn. At this rate: 9 turns of air.'), and fidelity is GATED ON ATLAS'S OWN INTEGRITY: >60 full numbers, 28-60 the numbers slip ('… I had the numbers a moment ago.'), ≤28 silent — maintaining the ship-mind is maintaining your ability to understand your own death; the raw truth stays on the power board so nothing is unfair. (3) BROWNOUT MODAL = CLASSROOM — openAllocate now prints the derivation (output = reactorBase × hull%, 'Repair the hull to restore reactor output'), per-row real consequences read from the exact formulas that execute (off scrubbers → 'net O₂ −N/turn'; off pods → 'sleepers take −25/turn; they will die in their sleep'), and the run-under-brownout button captions its true cost (air −deficit×1.5, crew −3). (4) POST-MORTEM ON EVERY LOSS — renderEnd gains two panels: FLIGHT RECORDER (the chain as dated rows + ATLAS's closing 'Final analysis: day N's damage did not kill this crew. The arithmetic did — M days later.') and WHAT YOU NEVER FOUND (accusations for untouched systems — 'You never once opened the power board — the ship was rationing your air without you.' — plus 'You died in Act I of III', the endings-seen count, and the printed loss-rank-cap truth 'Ranks above DRIFTER are for crews that arrive'). Wins get the recorder as a memoir, no accusations. (5) THE CHASE — showLogbook gains the ENDINGS GALLERY (16-tier census, earned endings named ×count, unseen as ◼-silhouettes with one-word hints — 'both', 'hedge', 'clock' — legacy tiers auto-append from meta so the census can never lie), THE LADDER (all 5 ranks, best marked, delta-to-next, the day-400 speed-bonus truth), and BEST PER DIFFICULTY (the climb made visible). endGame records compact chain+firsts INTO meta.runs (post-mortems revisitable) + meta.tiersSeen/bestByDiff with a one-time backfill from pre-gallery run history in loadMeta. (6) HONESTY PASS — title: 'Reaching Proxima is the middle of the story. There are three acts. Almost no one sees the third.'; How-to rewritten around The Arithmetic / The Long Dark / The Shape of the Story ('death is permanent... Death is also how you learn'); store Tips became a PROVISIONING BRIEF computed from live formulas (crew breathe X, scrubbers return Y — 'your tanks bleed even when nothing goes wrong', '2 doses of medicine. Sickness does not care.', 'Corpses don't trade.'); Settler blurb: 'Where you learn why you die. Even perfect play loses more than it wins.'; Voyager: 'Most crews die in the dark. Yours will probably be one of them.'; thrust modal states the per-light-year air law; pods modal states the exact 1.0-vs-0.1 arithmetic; hazard modals name their VISIBLE danger drivers (hull %, sensors dark, no one at the helm) — hidden meters stay hidden, per the constitution. VERIFIED: new test/onramp.js drives a REAL suffocation death through the real dispatch (empty tanks, weak crew, handle('continue') until ended) and asserts the chain wrote itself with named causes, the post-mortem + accusations + act marker rendered, meta carries chain/firsts/tiersSeen/bestByDiff, the gallery + ladder + silhouettes render, and How-to/title honesty is live. GATE PASS — 14 harnesses green, frozen-three md5-IDENTICAL to baseline (the proof that zero odds changed), endings golden untouched." },
  { date:"2026-07-10", tag:"fix", title:"RE-VISION Phase 0 — Reconcile & guard: permadeath survives reload (S9), dispatch error boundary + honest autosave (S1-2/S2-1), audits committed, constitution installed",
    body:"Housekeeping first: the local repo was 9 commits behind its own origin — fast-forwarded, after which HEAD is byte-identical to the deployed Y:\\ProximaTrail build (all four files md5-matched), and the three 2026-06-27 studio audits (code/design/UX) were committed from untracked. EXPLOIT KILLED (audit S9): hazard/station/void interaction queues were module-level arrays and checkArrival advances waypointIndex BEFORE queueing — so arriving at the Belt, seeing 'HAZARD AHEAD', and refreshing the browser emptied the queue and waved the ship through the crossing, the cheapest save-scum in the game. Queues now live on game._pending (hazard keys + WAYPOINTS indices, JSON-safe), the autosave carries them, flushQueues() re-fires them after resume, and pend() lazily upgrades pre-fix saves. New harness pending_persist.js proves the full serialize→fresh-boot→re-present loop + the legacy-save upgrade. BOUNDARY (S1-2): handle() — the single dispatch for every user action — gains a try/catch that on any fault saves the run, logs a SYSTEM FAULT line, and re-renders (with a static reload-and-Resume notice if the renderer itself broke); additive window error/unhandledrejection listeners save the run for timer-escaped errors WITHOUT assigning window.onerror (the harnesses' error-trap seat). Under permadeath a transient bug must never freeze a player out of a run they were winning. HONEST AUTOSAVE (S2-1): save() writes a slim blob (log capped at 80 in the saved copy) and, when a storage write fails, warns ONCE per outage in the log ('AUTOSAVE FAILED — this run may not survive a reload') instead of silently no-oping; recovery re-arms the warning. New harness error_boundary.js proves the fault is eaten in-dispatch (the shared trap stays silent), the app stays alive, quota warns once, and the save recovers slim. CONSTITUTION (CLAUDE.md): the sacred list is RETIRED as law and replaced by six principles (the arithmetic doesn't care · legible brutality · grief has names · comedy lives in the mundane · hope is earned, never issued · the mission outlives you); what survives of the old list survives on merit; the md5 zero-diff gate is re-scoped from design law to DRIFT ALARM (changeable deliberately with a same-commit baseline update + commit-message declaration, never silently); S2-2/S2-4/S3-1/S3-3 unfenced into Phase 5; tuning contract recorded (naive 0% everywhere / Settler ~35-45 / Pioneer ~25-35 / Voyager ~10-15). GATE PASS at each step — 12 then 13 harnesses green, frozen-three md5-intact throughout." },
  { date:"2026-07-02", tag:"fix", title:"M-UI3c — homebound chart orientation: progress now reads left-to-right (Tom: 'the progress bar isn't accurate')",
    body:"Byte-check first: every number was consistent (f = v.distance/v.total, the 'N / total home' line, landmark at-fractions). The real defect was reading direction — M-UI3b chose 'same map orientation' (Earth left:0%, Proxima right:100%, ark flying leftward), so an ark 35% of the way home sat at 65% screen-x with the lit arc on the right: arithmetically correct, conventionally backwards, and it failed the only test that matters — the owner read it as WRONG. FIX (renderReturnMap markup only): the homebound chart now matches the outbound grammar — you fly rightward toward what is ahead. Proxima (behind you) 0% visited/win, Fold Seam 20, Halfway Dark 50, Last Beacon 80, EARTH 100% as the amber goal (current-colored, NO halo — the pulsing halo stays reserved for the next landmark so exactly one pulse exists per chart), ark un-mirrored, lit trail growing left-to-right behind it (rmChart standard direction; the reversed-lit-path/mirror branch is no longer exercised, CSS retained harmlessly). Headless jsdom verification at 35% home: ship left 34.9%, lit dasharray 34.9/100, node order and states exact. GATE PASS 11 harnesses twice (post-flip, post-halo-refinement); homeleg unaffected by design (its landmark-order assertion checks crossing indices, not screen x). Presentation-only: one function's markup strings; no odds, no logic, no constants." },
  { date:"2026-07-02", tag:"feature", title:"M-HOME1 — Return-leg named structure: the flight home gets a named trail (Phase 4, Tom's complaint: 'the flight home includes none of the excitement or detail or gameplay that the flight to Proxima has')",
    body:"Phase-4 plan (docs/orchestration/plan-phase-4.md) locked Decisions 1-5 before build. DECISION 1 = Option A (named void landmarks): a new voyage-scoped HOME_WAYPOINTS array — SIBLING of the outbound WAYPOINTS, never edited, never reused by name — tracked via v.waypointIndex (FORK P1a, mirrors the outbound game.waypointIndex+WAYPOINTS pattern) and positioned by fractional at (0→1) of v.total rather than an absolute CUM-style distance (FORK P2a — a landmark's position must survive mid-run distance jumps like the fold/crippling hazards, which a baked absolute distance could not). DECISION 2 = Option B (anchored decisions at some landmarks): rather than pure narrative-only texture, two of the three interior landmarks force a themed choice-event on arrival, delivered by a landmark-gated dispatch that reuses the ALREADY-COMMITTED VOYAGE_EVENTS/presentVoyageEvent/rollVoyageEvent/resolveVoyageCheck chain (FORK P3a) instead of a new resolver — zero frozen-three risk, and every effect still lands through voyageOutcome only, never the frozen applyOutcome. DECISION 3 = the proposed roster, locked as-is: The Fold Seam (at≈0.20, narrative-only — the shortcut you may or may not have taken outbound, foreshadowing the fold event); The Halfway Dark (at≈0.50, ANCHORED to the longdark VOYAGE_EVENTS entry — the loneliest point on the whole crossing, a morale/hibernation decision); The Last Beacon (at≈0.80, ANCHORED to the word VOYAGE_EVENTS entry, cond-gated on Earth not-silent — broadcast-or-run-dark, ties to Earth belief and the pursuer). All three are void/deep-space fiction (the empty BETWEEN), never reused Sol-station names — the fiction guard the plan required to avoid Option B's incoherence of re-transiting Saturn on a 180-ly interstellar crossing. WHAT SHIPPED: voyageCrossLandmarks(auto), hooked into voyageTurn between the arrival/crew-death checks and the peril roll, mirrors the outbound advance while-loop (game.js:724) but reads game.voyage, not game — a sibling, not a reuse; voyageLandmarkBeat logs the arrival blurb and, for anchored landmarks, pulls the matching VOYAGE_EVENTS entry by id and resolves it via the existing choice-event machinery (auto/off-front mode resolves inline with no modal, mirroring rollHomeHazard(auto)/rollVoyageEvent(auto)). renderReturnMap(v) now plots the 3 interior landmarks as rm-node/rm-label overlays between the Earth/Proxima endpoints, visited/current/future state, mirrored to the homebound chart's existing left:(1-f)*100% convention — reusing rmChart/rmGlyph/rmCurveY verbatim, presentation only, no new map engine. DECISION 4 = Option A locked (NO-OP): HOME_HAZARD_P=0.18 and HOME_EVENT_P=0.34 stay byte-identical in shipped code — the landmark structure alone is what's expected to absorb the 'quiet turn' complaint, not an odds change; M-HOME2 is therefore the documented no-op the plan prescribed. DECISION 5: every remaining M-INT2 constant (EARTH_DOOM_YEARS=220, VOY_YEARS_PER_TURN=1.6, EARTH_NOISE_P=0.30, LAUNCH_READY=100) stays byte-identical — the dual-birth-source question (a transit child can be born via BOTH voyageAgeCrew pregnancy and the newlife event) was measured in the sweep, not tuned, per the lock. VERIFICATION HARNESS: new test/homeleg.js (11th harness) drives voyageTurn(true) directly over three arms, n=200 full return crossings per arm (n printed): sound-ark (Pioneer, hull 100, no brownout, crew hibernated after turn 2 — mirroring the documented real lever for stretching finite stores on a long crossing) — measured survival 99.5% (within the DoD's [94%,100%] window), 32/200 winning arrival tiers, quiet-turn share 32.4%, transit births 13; wounded-ark (Voyager, hull 25, brownout) — measured LOST WITH ALL HANDS 35.5% (within the DoD's [28%,52%] window), quiet-turn share 31%, transit births 18; B-preview (ORCHESTRATOR RIDER 1 — sound-ark config with HOME_EVENT_P harness-runtime-overridden 0.34→0.40 via a get/set accessor pair at the test seam, restored immediately after the arm, ZERO shipped-byte change to the constant) — survival 99.5%, quiet-turn share 28.2% (down from ~32% at the shipped 0.34, as expected from more choice-events per turn), transit births 13. Repeat local runs (6×) held sound-ark in [96.5%,100%] and wounded-ark in [29.5%,39.5%], comfortably inside both windows with margin. AC1 landmark structure confirmed: every arrival across all 3 arms (n=600) passed all 3 interior landmarks in order (The Fold Seam → The Halfway Dark → The Last Beacon). RIDER 3 coupling-drift guard (an isolated clean crossing) confirmed The Halfway Dark logs and its anchored longdark beat resolves at that landmark. Global error trap installed, every crossing asserted to reach a real terminal state (an arrival tier or LOST WITH ALL HANDS) — FAIL LOUD, no silent/never-ending run. VERIFIED: scripts/verify.sh GATE PASS — 11 harnesses green (10 prior + homeleg), frozen-three (applyOutcome/resolveCheck/tryCompose) md5-identical, test/frozen-baseline.json byte-identical, composeEnding golden-locked and untouched. Diff confined to: startVoyage (+waypointIndex:0 field), voyageTurn (+landmark-crossing call), two new functions (voyageCrossLandmarks, voyageLandmarkBeat) + the HOME_WAYPOINTS array, renderReturnMap (+interior-node loop), and the test seam block — ZERO diff to WAYPOINTS/CUM/TOTAL_DIST/renderRouteMap, the outbound advance while-loop (game.js:724), ageCrew/outbound earthSignal, HAZARDS/applyHazardSeverity, confirmed via git diff hunk ranges against a4158f3." },
  { date:"2026-07-02", tag:"feature", title:"M-UI3b — Colony-front artwork parity: the homebound ark joins the starchart, the colony gets a face (Tom's catch)",
    body:"Tom caught the gap in M-UI3: the ship side got the new design language but the colony front did not — renderVoyage still ran the LEGACY text rocket (a ◄ glyph sliding a flat .track toward 'EARTH ⊕') and renderColony had no visual identity at all, just stacked panels. Shipped, presentation-only: (1) HOMEBOUND STARCHART — the .track bar is replaced by the same starchart system through a new shared rmChart() shell: Earth glyph on the left, Proxima star glyph on the right, the traversed arc LIT FROM THE PROXIMA END (the lit path runs the reverse direction so the glow trails from the world you left), and the ark marker MIRRORED (.rm-ship.home, scaleX(-1)) flying leftward toward home; renderRouteMap (outbound) now delegates to the same shell, so there is exactly one chart implementation serving both directions, and the dead legacy .track CSS was removed. (2) COLONY VISTA — a slim ground-truth strip inside 'The Colony' panel: Proxima's amber glow low on a starred sky, dark horizon ground with rock outcrops, three cyan-rimmed habitat domes with one lit door, and a comms mast with a blinking green beacon — the same holo-cyan-structures / amber-world language as everything else. Static composition; reads NO game state. DESIGN FIX CAUGHT IN REVIEW: the first vista cut used preserveAspectRatio:slice, which at desktop widths scaled the art ~3.3× and cropped the ENTIRE sky (sun and stars gone); the sky moved into CSS background layers (width-proof, like the viewscreen starfield) and the SVG kept only shapes that stretch gracefully under preserveAspectRatio:none. VERIFIED: GATE PASS — 10 harnesses green, frozen-three md5-intact, baseline untouched, gate-pinned constructs preserved; live browser 1440×900 (vista: glow/domes/beacon; voyage: lit-from-Proxima arc with the mirrored ark at the 65% position for a 35%-home state) and 390×844 (both screens zero horizontal overflow; the Earth endpoint label deliberately carries the 'nxt' class so it survives the mobile label reduction; vista 66px). Diff: game.js render layer only (rmChart/renderReturnMap/colonyVista + the one-line .track swap + vista insertion), style.css." },
  { date:"2026-07-02", tag:"feature", title:"M-UI3 — Ship & starchart artwork: the ark finally looks like an ark; the nav bar becomes a plotted crossing (intent-first redesign, presentation only)",
    body:"Tom asked for a graphics review of two elements — the between-locations ship and the navigation bar — with an explicit brief: do not polish the current art, design NEW from the intent. INTENT 1, the transit: it is this game's Oregon-Trail wagon shot, the breath between decisions where you watch everything humanity has left cross a piece of forever — which demands an ARK, not a rocket, and text glyphs (⊳—■▣) cannot carry it. Shipped: a designed inline-SVG colony ship — flicker-animated drive plume, engine block with amber radiator fins, cargo spine with lit cryo pods, a habitat ring with a sweeping highlight (the emotional signal: life aboard), lit command prow, blinking nav lights — plus per-variant destination art: a ring station (dock), Proxima Centauri b with terminator shading and an atmosphere rim (land), and drifting debris shards with a pulsing warning, red edge-vignette, and an ark shudder (hazard). ARCHITECTURE: all artwork is STATIC SVG in index.html; playTransit now only flips a data-variant attribute and CSS selects the art — the old textContent/destIcon writes are deleted, so the redesign introduces ZERO dynamic markup sinks (the project's fenced innerHTML concern is moot by construction); variant durations, skip handling, and sfx are byte-untouched. INTENT 2, the nav bar: it is not a progress bar, it is the mission plotted on a bridge starchart. Shipped: renderRouteMap now draws a shallow ballistic arc (SVG quadratic bezier; control-point x at the midpoint keeps x(t) LINEAR so node left-percentages stay in registration with the curve) stroked three times — dim full route, wide soft glow, bright lit arc — with the lit pair trimmed to the ship's exact fraction via pathLength/stroke-dasharray; waypoints are drawn glyphs riding the curve (Earth with moon · orbit-ring stations · warning-shard hazards · a dashed hollow circle for the void · an amber star + world for Proxima · hexagon default), coloured by state (visited cyan glow, current amber with a pulsing halo, future faint); and the ship marker is a MINIATURE OF THE TRANSIT ARK — same design language at 34px — gliding the arc with animated left+top. The label system (alternating above/below, cur/nxt reductions, all media rules) is byte-untouched: those constructs are gate-pinned. ENGINEERING NOTE, paint safety: the first cut glowed the lit arc with a drop-shadow filter and compositing measurably hung (screenshot capture timed out repeatedly) — a filter inside a preserveAspectRatio:none SVG rasterizes at the stretched scale; the glow became a wide soft understroke and paint recovered instantly. All new animations (plume, ring sweep, nav blinks, halo, marker plume, shard drift, warn pulse, shudder) are in the prefers-reduced-motion kill list. VERIFIED: GATE PASS — 10 harnesses green, frozen-three md5-intact, baseline untouched, every gate-pinned construct (.rm-label rules, .routemap padding envelopes, chip pins l1–l3) preserved; live browser at 1440×900 (starchart arc + glyphs + marker; land/dock/hazard transit freeze-frames reviewed) and 390×844 (rail, current node, ark marker, all 10 glyphs AND the Dist chip inside the 135px viewscreen cap; log 152px HELD; page/app/x overflow 0/0/0). Diff: index.html (static art), game.js render layer only (playTransit variant flip; renderRouteMap + rmCurveY/rmGlyph helpers), style.css." },
  { date:"2026-07-02", tag:"fix", title:"M-UI2c correction — DoD-6 viewscreen-internals FAIL: rail + current node clipped behind the new chip → ≤900px interior reclaim (rail 75–105, node 79–101, log 152px held)",
    body:"Orchestrator evidence on ab6b2ce at 390×844 confirmed the chip itself landed exactly as planned — 'Dist 0 / 434 ly' VISIBLE, joined the second chip row (no new row; vs-head 80px with or without it), page/app/x overflow 0/0/0, log 152px held — but DoD 6 FAILED: the route rail and the current waypoint node were clipped. Measured inside the 135px-capped viewscreen: vs-head ended y=93, .routemap started y=99 with height 80, so the rail (24px of top padding into the routemap) sat ~y=123–153, cut at the cap. The geometry was ALREADY borderline in P2 — the chip did not add a row — but the DoD pins rail + current node visible, so it had to be made true. FIX (orchestrator-directed CSS parameter tuning of existing constructs, all inside the ≤900px block, NO viewscreen-cap raise — same construct family the max-height:800px block already tunes for D2, so no new fork): (1) .vs-title{display:none} — the decorative NAVIGATION label burned a full head row at 390px; hiding it moved vs-head from ending at 93 to ending at 59. (2) .chip{font-size:11px; padding:2px 7px} — compresses both chip rows. (3) .routemap{margin:2px 0; padding:14px 10px 30px} — top pad 24→14 (the label offsets shrink with it), margins 6/2→2/0; the 30px BOTTOM pad is deliberate: it seats the below-rail cur/nxt label (needs 9px) AND pushes vs-foot fully past the cap — a first cut at 16px left a 12px mid-glyph sliver of the foot's first line poking into view, and the foot should stay cleanly clipped on mobile exactly as before this phase (the Dist chip IS its readout there). (4) .rm-label.abv top −18→−14 and .rm-label.blw top 32→26 — mirroring D2's blw 32→28 precedent — so an above- or below-rail cur/nxt label stays inside the tightened envelope. BUILDER IN-BROWSER MEASUREMENTS at 390×844 (supporting — official sign-off is orchestrator-run): vs-head 13–59 with all 4 chips in two rows (Dist chip 40–59); rail 75–105 INSIDE the 135 cap; current node 79–101; cur label (blw) 101–113 and nxt label (abv) 61–73 BOTH visible — a bonus beyond the DoD; vs-foot 137–183, fully past the cap, no sliver; log 152px HELD; min command button 44px; page/app/x overflow 0/0/0. At 1280×720: Dist chip display:none, .vs-title visible ('Navigation'), chip font at base 12.5px, vs-foot the sole ly-abs readout, 9/9 command buttons visible, zero overflow — and the desktop outcome is guaranteed unchanged by scoping, since every correction rule lives inside the ≤900px block. Gate re-run: GATE PASS — 10 harnesses green, frozen-three md5-intact, baseline untouched; the harness pins none of the tuned parameters, so assertion (l)'s mutation-test evidence stands. Diff: style.css only (+17 lines in the ≤900px block) + this docs pair." },
  { date:"2026-07-02", tag:"feature", title:"M-UI2c — D4: mobile-only distance chip restores numeric distance on mobile travel (presentation only)",
    body:"Micro-phase against merged HEAD ba0347a, closing the last verified divergence from the Phase-2 premise-gate FAIL: shipping the G3 fallback (topbar ellipsis, no #topbar-status hide) meant vs-foot — the only 'N / 434 ly-abs' numeric readout, game.js:4371 — is clipped by the mobile viewscreen cap, and the ellipsized topbar squeezes to zero chars at 390px, so mobile travel had NO numeric distance anywhere. Premise-gate evidence had already shown the .vs-chips row (game.js:4362-4367, flex-wrap:wrap, style.css) survives the mobile cap 3/3. FIX (T1.1, Fork K chosen 4a): renderTravel's .vs-chips markup gains a fourth chip after the Earth chip — <span class='chip dist'>...{round(game.distance)} / {TOTAL_DIST} ly</span> — a markup-string-only insertion reusing the same two expressions already rendered in vs-foot two lines below; no new state read, no logic, frozen-three untouched. Unit wording is DELIBERATE and was not aligned: the chip reads ' ly' (chip-scale brevity) while vs-foot keeps ' ly-abs' — a plan-pinned divergence, not an oversight. Rejected: 4b (CSS-only reflow of vs-foot at ≤900px) — the same evidence that killed the Phase-2 G1 hide showed vs-foot clips BELOW the viewscreen cap, and repositioning it inside a ~135px mobile viewscreen risks pushing the routemap out, a pixel gamble a micro-phase shouldn't take; 4c (waive D4) — unwarranted since a safe, gate-legal fix existed. FIX (T1.2, Fork L chosen L1 — mobile-only): style.css gains .chip.dist{display:none} near the base .chip rule and .chip.dist{display:inline-block} inside the EXISTING ≤900px block (no new media query) — desktop keeps exactly one distance readout (vs-foot) and renders byte-for-eye unchanged; rejected L2 (chip everywhere, duplicate with vs-foot on desktop — reintroduces the clutter D1/D2 just removed) and L3 (chip everywhere, hide vs-foot's distance span instead — churns a working desktop layout to fix a mobile-only absence). PROOF (T1.3): test/layout_onescreen.js extended with assertion (l) — not (k), already occupied by Phase 2's FORK-D1b — pinning three independent, content-specific constructs: (l1) the chip-dist markup string in game.js with a TOTAL_DIST-referencing expression, (l2) the .chip.dist default-hide rule, (l3) the ≤900px .chip.dist show rule; harness count stays 10 (Fork J posture carried). All three mutation-tested locally: each construct deleted individually → harness exits 1 with a printed, content-specific reason; file restored md5-identical after each check. Verified: scripts/verify.sh GATE PASS — 10 harnesses green, frozen-three (applyOutcome/resolveCheck/tryCompose) md5-identical, test/frozen-baseline.json BYTE-IDENTICAL to the unchanged pre-phase HEAD ba0347a (not updated); the entire game.js diff sits inside renderTravel's function body (game.js:4311-4419) as a single markup-string insertion — one chip-dist span, no data-* token, no logic, no new state reference beyond game.distance/TOTAL_DIST (both already rendered in the same function). Live evidence (390×844 Dist-chip-visible + route-rail/waypoint-node non-regression; 1280×720 no-chip/no-duplication) is orchestrator-run and PENDING outside this commit, same posture prior milestones held." },
  { date:"2026-07-02", tag:"fix", title:"M-UI2b correction — T1.4 premise gate FAILED → G3 fallback shipped; FORK-D1b: the freed space must actually reach the log (62→152px at 390×844)",
    body:"TWO corrections to 791b553, both CSS-only, driven by the orchestrator's live 390×844 measurements. FIRST — G3 FALLBACK (plan-sanctioned, T1.4/DoD-3): the premise gate on the G1 hide came back FAILED — the viewscreen's Day/Next chips were visible (3/3) but vs-foot was CLIPPED (bottom 322 vs viewscreen bottom 230), meaning the #crt:has(.bridge) #topbar-status{display:none} rule would have deleted the ONLY surviving distance readout on travel phones. Per the plan's encoded conditional, the hide rule is REMOVED and G3 ships: the T1.1 ellipsized single-line topbar (DAY n · NEXT: wp · d/total ly…) is retained on travel as that readout. Harness (h2) flipped to the G3 variant: it still requires the ellipsis floor and now REQUIRES THE HIDE'S ABSENCE — the check runs against comment-stripped CSS (the rule's tombstone comment legitimately quotes the dead selector) and was mutation-tested by reintroducing the rule (exit 1). SECOND — FORK-D1b (unplanned, execution-time, load-bearing; logged via log_event to plan-events.jsonl BEFORE this commit): the orchestrator's deeper finding was that even with the topbar space freed, the log STILL sat at ~62px because the freed ~87px flowed into the stations auto row (154px), not the log — the bridge's console row sits at min-content (dominated by the 288px commands stack) and the console's minmax(84px,1fr) log row never grows past its floor. Options considered: (a) bound the stations harder alone (~120px log, short of target), (b) compress the commands alone (~124-140px, short), (c) BOTH, targeting log ≥ ~150px — chosen. Shipped (all inside the ≤900px block): .bridge .stations max-height clamp(140px,24vh,240px) → clamp(96px,12vh,160px) — tuned from the fork's initial 14vh after in-browser measurement showed log only reached 131px, because the commands stack is TOUCH-FLOOR-DOMINATED (54px primary + 8×44px buttons — incompressible without eating tap targets, which is off the table); commands compression .commands/.cmd-grid gap 6→4px, .btn.primary padding 14→8px + font 17→15px (the same treatment the max-height:800px block already applies), .cmd-grid .btn and .commands .danger paddings tightened — the 44px cmd-grid/.btn.small and 48px primary min-height floors are UNTOUCHED and now harness-pinned; .bridge gap 6→4px (+4px). HONEST COSTS: stations drop to ~101px at 844 tall (header + ~2 crew rows glanceable, remainder behind the row's existing internal scroll) — that is real glanceability paid for log space; the command console is denser. Builder in-browser diagnostics at real viewports (supporting, NOT the official T4.3 evidence): 390×844 travel — log 62→152px, no page scroll, min command button 44px, topbar single-line carrying the distance readout, crew STATUS inside its panel; 1280×720 travel — 0 labels clipped (cur/nxt only, below-rail label bottom 169 ≤ viewscreen bottom 172), all 9 commands visible, no page scroll (AC1 held); 390×844 title — EARTH IS DYING single line, hero intact, no page scroll. New harness assertion (k) pins the D1b reclaim: stations vh term ≤14, a .btn.primary padding compression present, and the 48px primary floor still present; (k1)(k2)(k3) each mutation-tested (24vh restored / padding removed / floor removed → exit 1, file restored md5-identical). Verified: scripts/verify.sh GATE PASS — 10 harnesses green, frozen-three md5-intact vs the SAME UNCHANGED baseline; diff still style.css + test/layout_onescreen.js + docs pair only, zero game.js/index.html diff." },
  { date:"2026-07-02", tag:"feature", title:"M-UI2b — Post-merge remediation: D1 mobile topbar, D2 route-label clipping, D3 crew-table STATUS clipping (presentation only, CSS-only)",
    body:"Targeted remediation of three verified divergences from the Phase-1 reconcile loop, cited against merged HEAD af85b37 (style.css 533 lines) — NOT a feature phase. D1 (degrades-goal): #topbar is OUTSIDE #app, so on travel its status string (DAY n · NEXT: wp · d/total ly-abs, filled by updateTopbar) wrapped ~5 lines at 390px, stealing budget from the #crt frame and squeezing the travel log to ~62px — worse, that string byte-duplicates the viewscreen's own Day/Next chips + vs-foot distance readout. FIX (T1.1, unconditional): the ≤900px block gets #topbar-status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} — this alone caps the damage to one line everywhere, on every screen, in any browser, and ships regardless of the fork below. FIX (T1.2, G1, travel-scoped hide — SHIPPED SUBJECT TO THE T1.4 PREMISE GATE): #crt:has(.bridge) #topbar-status{display:none} removes the fully-redundant line on travel only (.bridge is travel-only, single emit site in renderTravel) while title/setup screens keep their non-duplicated BEST-SCORE/EARTH-IS-DYING line. This executor cannot run a browser, so it cannot itself confirm the premise the hide depends on: that the viewscreen's Day/Next chips AND the vs-foot distance readout actually survive uncropped at 390×844 once #topbar-status is gone — vs-foot is the LAST child of the overflow:hidden viewscreen (capped clamp(96px,16vh,140px) on mobile, ~135px at 844 tall) and wrapped chips + the routemap could clip it before the topbar disappears. Both T1.1 and T1.2 are committed together per the executor's brief; the orchestrator owns the live 390×844 verification and the ship/fallback call — if evidence shows vs-foot clipped, a follow-up commit removes the :has(.bridge) hide and falls back to G3 (ellipsis-only, topbar retained as the ONLY surviving distance readout on travel). Where :has() itself is unsupported by an engine, the rule is simply ignored and T1.1's floor still holds — one redundant line, never five. D2 (cosmetic): at max-height:800px, ≥1100px-wide desktops render every waypoin­t label (the ≤1100px cur/nxt reduction doesn't reach them) inside a viewscreen capped at 14vh — .rm-label.blw sits at top:32px under the 30px rail plus .routemap's 24/26px padding, which together exceed the cap and clip below-rail labels mid-glyph. FIX (T2.1+T2.2, Fork H3 — both together, existing constructs only): the max-height:800px block gains the same cur/nxt-only .rm-label reduction already used at ≤1100px, PLUS .routemap padding 24px 10px 26px→16px 10px 18px and .rm-label.blw top 32px→28px, tightening the plot's vertical envelope so even a below-rail cur/nxt label fits the 14vh cap. No cap raise (rejected, Fork H — would steal console-row budget and risk reopening the Phase-1 AC1 no-scroll guarantee at 1280×720). D3 (cosmetic, shared component): .crew-head/.crew-row share one grid (16px minmax(120px,1.5fr) 1fr 1fr 88px, gap:10px) that overflows its panel at 390px — 144px of fixed-column+gap overhead — clipping the last STATUS column; the SAME grid renders on travel (stations panel), colony, and voyage (crewStrip). FIX (T3.1, Fork I1 — uniform retune, not voyage-only): the ≤900px block retunes the shared grid to 14px minmax(84px,1.4fr) 1fr 1fr 60px, gap:6px (98px overhead, freeing ~46px for name/bars) and trims .crew-head letter-spacing 2px→1px so STATUS fits its narrower 60px track; applied uniformly because there is no voyage-unique ancestor selector and travel/colony clip the same way at 390px — a strict improvement at all three call sites, not scope creep. PROOF: test/layout_onescreen.js extended in place (Fork J1 — same file/media-block family, harness count stays 10, not a new file) with three presence-only assertions: (h2) the ≤900px block carries the #topbar-status ellipsis rule (always, independent of which D1 fork ships); (i2) the max-height:800px block carries both the .rm-label cur/nxt reduction and the .routemap padding tightening; (j) the ≤900px block's .crew-head/.crew-row grid-template-columns override has a last track ≤64px (bound catches a regression back toward the 88px desktop track). All three were mutation-tested locally: each construct deleted individually → harness exits 1 with a printed reason; file restored md5-identical after each check. Verified: scripts/verify.sh GATE PASS — 10 harnesses green, frozen-three (applyOutcome/resolveCheck/tryCompose) md5-identical to the SAME UNCHANGED test/frozen-baseline.json, endings golden present; diff scope is style.css + test/layout_onescreen.js ONLY — zero game.js, zero index.html diff (all three fixes are CSS-only, per plan DoD 2). Live-evidence pass (T4.3: D1 390×844 before/after log-height + chips/vs-foot visibility premise check or recorded G3 fallback + title-screen ellipsis sanity; D2 1280×720 no-clip check; D3 390×844 voyage/travel/colony crew-table shots) is orchestrator-run and PENDING outside this commit — same posture M-UI2's T5.3 evidence pass held." },
  { date:"2026-07-02", tag:"decision", title:"M-UI2b — Fork G (D1, conditional G1/G3) + Fork H (D2, H3 both) + Fork I (D3, uniform I1) + Fork J (harness, extend not new)",
    body:"Four disclosed forks, docs/orchestration/plan-phase-2.md. FORK G (D1 mechanism, the load-bearing one): options were G1 (:has(.bridge)-scoped hide + unconditional ellipsis floor, chosen conditionally), G2 (unconditionally hide #topbar-status at ≤900px — simpler, but deletes the non-duplicated BEST-SCORE line on title/setup phones), G3 (ellipsis only, never hide — keeps a truncated-to-uselessness 'DAY 12 · NE…' line burning a topbar row on travel), G4 (edit updateTopbar to emit a short mobile string — cleanest data fix but a JS function-body edit, outside this phase's CSS-only presentation gate, and updateTopbar can't know viewport width without more logic anyway). Chosen G1, but ENCODED AS A CONDITIONAL per the plan's T1.4 premise gate (reviewer MAJOR-1): G1's redundancy premise only holds if the viewscreen's Day/Next chips AND vs-foot survive uncropped at 390×844 once the topbar line is gone — this executor has no browser and cannot verify that itself, so it shipped BOTH T1.1 (unconditional ellipsis floor, safe regardless) and T1.2 (the :has(.bridge) hide) in this commit, explicitly flagged SUBJECT TO orchestrator verification. If the orchestrator's live evidence shows vs-foot clipped, T1.2 gets reverted in a follow-up commit and G3 becomes the shipped variant instead — the fallback path costs one extra commit, not a redesign, because T1.1 alone already caps the worst case at one redundant line. G2 was rejected as the cheaper option because it deletes real non-duplicated information on non-travel screens for the price of one extra selector saved. FORK H (D2 mechanism): H1 (label reduction alone) still clips when cur/nxt lands below-rail since .blw is index-parity, not state; H2 (padding/offset alone) is a few-px margin call sensitive to font metrics; chose H3 (both together, deterministic within existing constructs). H4 (raise the 14vh cap) rejected — steals console-row budget and risks reopening the Phase-1 AC1 no-scroll guarantee at 1280×720; a cosmetic fix must not gamble that guarantee. FORK I (D3 scope): I2 (voyage-only via a structural selector) has no voyage-unique ancestor — the crew panel is a generic .col .panel — so any selector attempt either matches colony anyway or is a brittle :has() chain; I3 (hide the Status column on phones) deletes information. Chose I1 (uniform ≤900px retune for all crew tables) because the defect lives in the shared grid, not in voyage specifically, and travel/colony hit the identical overflow at 390px — a voyage-only fix would be a partial repair wearing a scoping costume. Per the Phase-1 Fork-E precedent (verify blast radius, don't argue it), the plan mandates evidence at all three call sites (voyage, travel non-regression, colony) rather than accepting I1's colony/travel benefit by argument alone. FORK J (harness posture): J2 (new test/layout_remediation.js) would split layout truth across two harnesses for 3 asserts; J3 (no harness change) leaves the remediation unpinned — a later cleanup could silently delete the :has() rule and nothing would notice, violating this project's pin-what-you-fixed discipline. Chose J1: extended test/layout_onescreen.js in place — same file/media-block family it already pins, harness count stays 10 (MIN_TESTS=9 still cleared with headroom). Also reaffirmed this session: PLAN-FILE DISCIPLINE (docs/proxima-trail-implementation-plan.md read fresh from committed HEAD, reconciled/updated in place, re-fetched to confirm growth) and the docs-pair rule (this dashboard entry + the M-UI2b Addendum land in the SAME commit as the code)." },
  { date:"2026-07-02", tag:"feature", title:"M-UI2 — One-screen bridge: zero page scroll on desktop + mobile (presentation only, engine untouched)",
    body:"M-UI1 gave the bridge its look; M-UI2 makes it FIT. On short desktop viewports and especially on mobile (390×844), the .bridge column (viewscreen min-height 158px + two station panels + the console's log+commands) overflowed the #app scroll container and pushed the Continue button below the fold — worse on mobile, where the console stacked log THEN commands (@media max-width:900px), burying every action under the log. GOAL: the travel screen plays with the ship's log AND all action buttons visible/reachable at once, with no page scroll, on desktop (≥1280×720) and mobile web (390×844 portrait). FOUR CHANGES, style.css only (+ one index.html token): (1) VIEWPORT PLUMBING — #crt gains a 100dvh height line after its 100vh fallback, so iOS Safari's dynamic URL bar no longer causes phantom overflow; body padding gains env(safe-area-inset-*) after its 10px fallback for notch/home-indicator clearance; index.html's viewport meta gains the single ', viewport-fit=cover' token required for env() to be non-zero on iOS (no other index.html byte changed). html,body and #app also gain overflow-x:hidden as a backstop against horizontal scroll. (2) DESKTOP FIT (AC1) — .bridge converts from a flex column to display:grid; grid-template-rows: auto auto minmax(min-content,1fr), PAIRED with contain:size on .log-wrap: the console row absorbs whatever height is left but can never shrink below the COMMANDS stack's intrinsic height, because contain:size removes the log's unbounded scrollback from the row's min-content floor — the commands are structurally unclippable and the log is the only slack absorber. No overflow:hidden on .console (an undersized row must overflow VISIBLY, never silently swallow buttons). .viewscreen's min-height:158px becomes min-height:0 + max-height:clamp(120px,22vh,200px); .console/.log-wrap gain min-height:0; the log's own min-height drops 160px→96px; and a @media (max-height:800px) block tightens the viewscreen (14vh) and caps the station panels (30vh, internal scroll) so the floored console fits a 720px-tall desktop — the log's existing internal overflow-y:auto absorbs older entries, exactly where scrolling belongs (you scroll the log, never the page). CORRECTION HISTORY: the first cut (commit 7974884) used minmax(0,1fr) + .console overflow:hidden — the live-evidence run caught it at 1280×720 clipping ATLAS and Abandon invisibly (page unscrollable, buttons simply gone: precisely the clipping masquerade DoD 7 exists to catch); the min-content+contain:size pair is the corrected construct, and the harness now pins it. (3) MOBILE FIT (AC2) — the ≤900px block tightens the viewscreen (clamp(96px,16vh,140px)), bounds the STACKED stations at clamp(140px,24vh,240px) with internal scroll (stacked to one column at 390px the two panels run ~450px tall and blew the 844px budget the same way), zeroes the log's desktop min-height so the 84px track floor governs, and turns .console into grid-template-rows: minmax(84px,1fr) auto: the log scrolls in row 1, and BOTH .commands variants (manual: Continue+cmd-grid+ATLAS+Abandon; autopilot: Run/One-turn/Emergency-wake) pin to row 2 at the bottom of the bridge — no markup reorder, so keyboard shortcuts, data-action wiring, and #sr-live are untouched. Builder in-browser layout checks (diagnostic, not the official T5.3 evidence): 1280×720 rows 109/216/265 with all 9 buttons visible and zero page/app/horizontal scroll; 1920×1080 log 455px, all visible; 390×844 manual AND autopilot states all buttons visible at ≥44px with no log/command overlap; colony-replica .menu.row at 390×844 — 44px floor, no overlap, no right-edge clip. Touch targets: .cmd-grid .btn / .commands .btn.small get min-height:44px, .btn.primary gets 48px. (4) FORK E, GLOBAL 44px FLOOR — .menu.row .btn also gets min-height:44px at ≤900px, a strict monotonic improvement (can only raise a minimum, never regress a layout) that reaches colony/voyage's mobile action rows too; per the orchestrator's ruling this cross-screen blast radius must be VERIFIED not merely argued — the mandatory colony+voyage 390×844 screenshots are T5.3 orchestrator-run evidence, pending sign-off outside this commit. PROOF: new test/layout_onescreen.js (node, no DOM — the gate has no browser dependency) statically asserts every construct above is present in committed style.css/game.js and FAILS LOUD if one is removed; it is the 10th harness, raising the gate's green count from 9 to 10. The harness was HARDENED after the live-evidence failure — its original assertions green-lit the clipped first cut, so it now pins the corrected never-clip pair (minmax(min-content,1fr) + contain:size), rejects overflow:hidden on .console, and requires the mobile stations bound and the short-viewport media; each new assertion was mutation-tested (construct deleted → exit 1 with a printed reason, file restored md5-identical). Verified: scripts/verify.sh GATE PASS — node --check; frozen-three (applyOutcome/resolveCheck/tryCompose) md5-identical to the UNCHANGED test/frozen-baseline.json; all 10 harnesses green incl. endings_golden; zero diff inside renderColony/renderVoyage function bodies (.viewscreen confirmed travel-only by grep, game.js:4359, used only in renderTravel); index.html diff is exactly the single-token ', viewport-fit=cover' append." },
  { date:"2026-07-02", tag:"decision", title:"M-UI2 — Grid layout (Fork A) + dvh/vh (Fork B) + grid-pinned commands (Fork C) + .bridge-scoped selectors (Fork D) + global 44px floor (Fork E)",
    body:"Five load-bearing forks, all disclosed in docs/orchestration/plan-phase-1.md. FORK A (fit strategy): chose a CSS grid with a flexible console row over clamp/scale shrink-to-fit (breaks touch-target physical size) or a collapsible-panel accordion (adds interactive state = logic, crosses the presentation-only line) — the grid reuses the log's existing internal scroll, which is where scrolling belongs. WITHIN Fork A, the row construct was corrected after the live-evidence run: minmax(0,1fr) let the row shrink below the commands stack (which .console's overflow:hidden then clipped invisibly at 1280×720); the coordinator-directed correction floors the row at minmax(min-content,1fr) and pairs it with contain:size on .log-wrap so the floor measures ONLY the commands — the log cannot inflate it, the commands cannot be clipped, and overflow:hidden is gone so any future failure is visible instead of silent. The same budget discipline was extended where the evidence showed it breaking: a max-height:800px media tightens viewscreen/station caps for short desktops, and the ≤900px block bounds the stacked stations (~450px tall at 390px wide) with internal scroll. FORK B (mobile viewport unit): chose 100dvh with a 100vh fallback line over plain vh (phantom overflow from the iOS URL bar), svh (under-uses space), or a JS --vh custom property (a script — avoidable, and dvh's 2023+ support is broad enough now). FORK C (mobile command reachability): chose grid-pinning the commands row to the bottom of .console, log scrolling above it, over a sticky/fixed bottom bar (iOS dynamic-toolbar quirks, can escape #crt) or tabbed log/actions panels (hides one or the other — the DoD requires BOTH visible at once, and tabs add toggle logic). FORK D (scoping without a logic hook): scoped every travel-fit rule to .bridge and its descendants (renderTravel's own wrapper, grep-verifiable) rather than adding a body.screen-travel class (a classList call = logic edit) or restyling globally and hoping colony/voyage don't regress. FORK E (touch-target scope) — the one fork with review history: originally accepted as a global ≤900px min-height:44px on .menu.row .btn on a 'monotonic improvement, can't regress' rationale alone; a Devil's-Advocate pass conditionally overturned that acceptance for relying on argument rather than evidence. The orchestrator ruling: E2 (global) STANDS, but the cross-screen blast radius must be VERIFIED, not argued — colony AND voyage 390×844 screenshots under the new floor became MANDATORY DoD evidence alongside the travel-state shots; those screenshots are T5.3 orchestrator-run evidence (this build ships the CSS + the static harness; the live-viewport sign-off happens outside this commit). Also reaffirmed this session: PLAN-FILE DISCIPLINE (docs/proxima-trail-implementation-plan.md read fresh from committed HEAD before planning, reconciled/updated in place, re-fetched to confirm the line count grew) and the docs-pair rule (this dashboard entry + the M-UI2 plan Addendum land in the SAME commit as the code)." },
  { date:"2026-07-01", tag:"feature", title:"M-UI1 — Glass-bridge UI overhaul (full-viewport bridge; presentation only, engine untouched)",
    body:"Tom's verdict on the old UI: 'it's not doing it for me' — and the diagnosis agreed: the whole game was a dim 1000×780 box floating in a black void, everything 11–13px over identical navy panels, resource bars 7–8px slivers, the route labels physically colliding ('Earth Orbit' ended at x=255 while 'Lunar Gateway' began at x=225), the title-screen ASCII logo misrendering as noise, Continue indistinguishable from eight sibling pills with permadeath's Abandon run seated right beside it, and the ship's log — the emotional heart of an Oregon-Trail game — cramped into 168px at the bottom. M-UI1 is a PRESENTATION-ONLY overhaul: #crt now fills the viewport; base type moves to 14px on a DIN-style flight stack (Bahnschrift display, Cascadia/Consolas mono numerals — system fonts only, still zero external assets). THE TRAVEL SCREEN IS A BRIDGE: (1) VIEWSCREEN — the nav panel becomes an actual window: two drifting parallax CSS starfields, a destination planet glowing on the plot's far edge, and Day/Next-waypoint/Earth-signal as HUD chips riding the glass instead of a label/value form with a dead middle. (2) ROUTE PLOT — every waypoint is now labeled, alternating above/below the rail so neighbours can never collide (the old code labeled only current/previous and stacked them on one line); under 1100px only current/next survive. (3) COMMAND CONSOLE — the log takes all remaining viewport height beside a vertical command stack: ▶ CONTINUE is a big amber primary key with its SPACE hint, the six station verbs (Thrust/Rations/Power/Pods/Repair/Mine) form a 2-col key grid, ATLAS sits below, and Abandon run is exiled under a separator styled as the dangerous outlier it is. (4) STATIONS — supplies bars grow to 12px with gauge-tick texture; the crew strip gains a real header row (Name/Health/Morale/Status) replacing the unreadable per-row 'hp/mor' micro-labels. (5) TITLE — the broken ASCII art is replaced by a full-bleed hero: PROXIMA TRAIL in big glow type over a starfield with a planet rising from the fold, same actions and shortcuts (R/N/H/L). Scope discipline: edits confined to style.css (rewritten) + four render functions' MARKUP (renderTitle, renderRouteMap, renderTravel, crewStrip) — every data-action, keyboard shortcut, a11y affordance (#sr-live announcer, modal focus trap, prefers-reduced-motion kill-switch) and every other screen's markup untouched; colony/voyage/store/role/end inherit the new system purely through CSS. Verified: scripts/verify.sh GATE PASS — 9 harnesses green, frozen-three (applyOutcome/resolveCheck/tryCompose) md5-identical, endings_golden green; live browser pass at 1440×900 and 820×900 over title → role → outfitting → launch → travel (played to day 133 via automation: hull-breach hazard modal, Lunar Gateway/Ares/Titan station+trade modals, red-alert state confirmed active at oxygen 9, 8-crew roster with a child, full colored log)." },
  { date:"2026-07-01", tag:"decision", title:"M-UI1 — Full bridge redesign over polish-pass or re-theme (Tom's pick); presentation-only boundary",
    body:"Three directions were offered: (a) FULL BRIDGE REDESIGN — fill the viewport with a persistent bridge (viewscreen / stations / console); (b) polish pass keeping the old 1000px layout; (c) abandon the LCARS-navy look for a different aesthetic. Tom picked (a). The identity KEEPS the established cyan-holo + amber-command palette (it was never the problem — the execution was too thin and too small) and commits harder: glass panels with accent spines, tick-textured gauges, DIN flight typography, an actual starfield in the nav plot. The hard boundary honored throughout: this milestone changes NOTHING the sacred list guards — no odds, no economy, no difficulty, no hidden meters; zero edits to game logic (the diff is style.css + markup strings in four render functions), proven by the deterministic gate rather than asserted." },
  { date:"2026-06-28", tag:"feature", title:"M-INT1b — Parallel-fronts legibility layer (the unfocused front becomes legible; engine untouched)",
    body:"The dual-front machinery (run a colony on Proxima while a crewed ark crosses home) has been live since P3-M2, but the UNFOCUSED front was blind: acting on one front auto-ticks the other silently, and the player couldn't see the off-front's state, what happened there, or the two timelines piling up. M-INT1b is a PRESENTATION-ONLY layer that makes the already-running second front legible — no gameplay, no rate/odds/constant change, engine byte-identical where the zero-diff gate holds. THREE FEATURES. [2a] OFF-FRONT STRIP: one slim '.small dim' line per HUD, reading stored fields only — the voyage HUD shows '⇄ Colony — hope {round(hope)} · {stage} · yr {elapsedYears}' (when a live colony exists); the colony HUD shows '⇄ Ark — {round(distance)}/{total} home · {aboard} aboard · Earth {status}' (when the ark is active) — inserted under each header, render-guarded, computes nothing. [3a] SINGLE CANONICAL CLOCK (the corrected decision): instead of two competing per-front year-counts, ONE reconciled clock shared by both HUDs. The colony HUD's existing stat is REPOINTED — stat('Years since exodus', col.elapsedYears) → stat('Years since exodus', exodusYears()) — a one-line edit: no second year line, no 'Colony cycles' relabel. exodusYears() is voyage-safe (guards game.colony/voyage → 0), so a colony-only game shows the same value as before (shipYears freezes at landfall, so exodusYears()==col.elapsedYears there), while a dual-front game shows the reconciled max() wall-clock matching the voyage HUD. col.elapsedYears stays COMPUTED (colonyAgeDrift still uses it) — it just stops being the displayed stat; colony cycle progress remains in the panel title ('The Colony · Cycle N'). Relativity framing retired: voyage crew age 1.6/turn vs colonists 0.5/turn (crew age FASTER, the opposite of dilation), so a dual-year readout would be both incoherent and emotionally inverted. [1c] ADAPTIVE OFF-FRONT DIGEST: captureDigest wraps the two existing auto-tick CALL SITES (voyageAfterTurn:colonyAutoStep, colonyAfterTurn:voyageTurn) — it snapshots game.log.length before the tick and slices the entries the tick ITSELF produced into a transient game._offlog (never recomputed/re-rolled). On the next render, digestBlock surfaces them then clears: a QUIET tick yields one synthesized line ('The colony held steady — hope 64, year 28.'); a MAJOR beat (a log entry typed bad/good/sys, or a death/stage/hope-band delta from the read-only _offsnap) renders the captured log entries VERBATIM ('A micrometeoroid storm tore at the hull — Boris was lost to the dark.'). READ-ONLY DISCIPLINE: captureDigest reads game.log + writes only _offlog/_offsnap, never front state — so the off-front is byte-identical with vs without capture (harness (a) proves it); the tick bodies are untouched. SAVE: transient _offlog only — rides the whole-game save() harmlessly, old v7 saves lack it → empty digest, no schema break (stays v7, no migration). Verified: node --check game.js audio.js; ZERO-DIFF GATE — applyOutcome/resolveCheck/tryCompose/composeEnding md5-identical to HEAD AND colonyAutoStep/voyageTurn/colonyTurn bodies byte-identical (only their call sites wrapped); new /tmp/mint1b.js (18/18 via a DOM stub + the inert test seam, building a REAL dual-front game: (a) off-front {colony,voyage,crew,log} byte-identical capture-on vs capture-off; (b) BOTH HUDs render 'Years since exodus' == exodusYears() (=48 while col.elapsedYears=2), no 'Colony cycles', no second year line, no per-front juxtaposition; (c) quiet tick → one-liner, bad-typed + warn-logged-death ticks → full captured narrative, digest clears after surfacing; (d) v7 save round-trips with and without _offlog); endings unchanged by construction (composeEnding md5-identical); mobile 390×844 Playwright screenshots of both HUDs — no topbar overflow INTRODUCED (nothing added to #topbar; the title-screen topbar already overflows on HEAD), the [2a] strip adds 20px and the voyage action row stays above the 844 fold (586<844). One additive, production-INERT change beyond the deliverables: the existing __PROXIMA_TEST__ seam (previously exposing only composeEnding) was widened to expose the render/tick/helper symbols so the harness can render real HUDs — gated on window.__PROXIMA_TEST__, attaches nothing in production." },
  { date:"2026-06-28", tag:"decision", title:"M-INT1b — ONE shared clock via a colony-stat REPOINT (not a two-clock relativity readout)",
    body:"The corrected [3a] decision (locked by Tom, superseding the earlier two-clock sketch): surface a SINGLE reconciled 'Years since exodus' clock identical on both HUDs, not a 'crossing years vs colony years' juxtaposition. Rationale: exodusYears() is a generation-ship max() wall-clock; because voyage crew age 1.6/turn and colonists 0.5/turn, the crew age FASTER than the colonists — so a dual-year readout would be incoherent as 'one clock' and emotionally inverted (it reads like time dilation but is its opposite). Implementation is a one-line REPOINT of the colony HUD's existing stat from col.elapsedYears to exodusYears() — explicitly NOT adding a second line and NOT relabeling col.elapsedYears 'Colony cycles' (it is a YEARS value, not a cycle count). col.elapsedYears stays computed for colonyAgeDrift; colony cycle progress stays legible in the panel title. The voyage HUD already read exodusYears() (P3-M4), so it is untouched — and both HUDs now read an identical clock. Two stale plan paragraphs (the M-INT1-era 'colony shows Years-since-exodus via col.elapsedYears' notes at ~549/~626 of the implementation plan) were annotated '(superseded by M-INT1b [3a])' rather than rewritten, preserving the historical record. Also adopted this session: PLAN-FILE DISCIPLINE — the committed docs/proxima-trail-implementation-plan.md is the source of truth (read fresh from HEAD before planning/building, reconcile chat-only plans into it, verify the line count grew after writing), and the plan now travels with every dashboard update in the same commit." },
  { date:"2026-06-27", tag:"feature", title:"P3-M4 — Earth's fate (bounded divergence) + Years-Since-Exodus clock + voyage generations",
    body:"The home front's emotional loop closes. Before P3-M4, Earth was a coin-flip read from the OUTBOUND clock: earthSignal() flipped game.earth.status live→silent off game.distance/TOTAL_DIST and was the only status writer (it never even stored 'faint'); on the voyage it fired off STALE outbound globals, so the home-crossing Earth arc ran on the wrong clock, and voyageArrive was binary (silent→TOO LATE, else MESSENGER/THE LONG WAY HOME). And voyage crew never aged — a transit-born child could be BORN (the newlife event) but never grew up. P3-M4 builds the plan's six decisions as SIBLINGS (the outbound earthSignal + ageCrew stay BYTE-IDENTICAL, per the colonyAgeDrift / voyageHazard* precedent). (1) BOUNDED DIVERGENCE: game.earth gains a hidden truth and a shown estimate over EARTH_BANDS = [thriving,recovered,changed,silent,gone] (seeded 2/2). earthTruthStep() drifts truth time-pressured via exodusYears()/EARTH_DOOM_YEARS (worse = 0.10 + pressure*0.50, better = 0.10*(1−pressure)) — a long endeavor trends worse, a young one can RECOVER. The estimate update is LAG (one step toward truth) + NOISE (EARTH_NOISE_P jitter) + a hard CLAMP to [truth−1, truth+1], so belief lags and wobbles but provably never diverges more than one band. (2) BACK-COMPAT: status becomes a DERIVED view of belief — deriveEarthStatus(est)=['live','live','faint','silent','silent'][est], rewritten each voyage tick — so every legacy .status reader keeps working AND 'faint' is finally reachable (the dead branches at the voyage/outbound HUD come alive). (3) CLOCK: exodusYears() (computed-on-read = shipYears + max(colony year×CYCLE_YEARS, voyage turn×VOY_YEARS_PER_TURN) — colony+voyage are ONE wall-clock, so max not sum) is surfaced on the voyage HUD title and a new 'Years since exodus' stat (the colony already showed it) and drives the truth-drift. (4) voyageEarthSignal() SIBLING runs off the VOYAGE clock (one-line swap in voyageTurn; outbound earthSignal untouched). (5) voyageAgeCrew() SIBLING ages v.crew off VOY_YEARS_PER_TURN (AGE_HIB pauses sleepers); a transit-born child reaching COME_OF_AGE MANS a station — preferring Pilot when none is awake (which directly lowers voyageHazardDanger), else a needed role — with OLD_AGE mortality and a v._pregnancy gestation/birth path mirroring ageCrew. (5b) voyageArrive now resolves on earth.TRUTH: gone→TOO LATE, silent→A SILENT SHORE, changed→MESSENGER (or THE LONG WAY HOME by hull), recovered/thriving→WORD WORTH CROSSING FOR — so the arrival can honestly surprise within the one-band bound. HANDOFF-SEAM FIX (the plan omitted it): startVoyage reconciles truth/estimate FROM the observed outbound status — if Earth went silent on the way out, truth is bound to ≥3 and estimate=truth, so the first voyage tick can never 'revive' a silenced Earth to 'faint' and the truth-based arrival stays consistent. OUT OF SCOPE (flagged): composeEnding generalization (M-INT1, which will READ earth.truth/exodusYears()); the parallel focus toggle (M-INT1b); EARTH_DOOM_YEARS / VOY_YEARS_PER_TURN / EARTH_NOISE_P tuning (M-INT2). Verified: node --check game.js audio.js; ZERO-DIFF GATE — applyOutcome/resolveCheck/composeEnding/tryCompose md5-identical to HEAD AND the outbound earthSignal (md5 8e733c2…) + ageCrew (md5 fb8370b…) BYTE-IDENTICAL; new /tmp/earthm4.js (33 assertions + a winnability smoke: |estimate−truth| ≤ 1 across a long randomized run; a long endeavor lands a worse truth-at-arrival than a fast one — long mean 3.95 vs fast 2.17 over 80 crossings — with exodusYears() surfaced and advancing 202 vs 7; belief diverges from truth-at-arrival within ±1 on 16/80 arrivals; voyage crew age and a transit-born child matures to MAN the vacant Pilot station at a real skill; status is always ∈ {live,faint,silent} and 'faint' is reachable; the headless off-front auto tick opens no modal and errors none; the SEAM keeps a silent launch silent — truth≥3, no 'faint' flicker — and voyageArrive resolves TOO LATE / A SILENT SHORE never MESSENGER; the five arrival tiers map correctly to the five truth bands; a timely sound crossing still reaches a LIVE-Earth win 20/30 of the time — the dread clock is not a death sentence); regression crossingm2 + homehaz + homesmoke + colonyskel + colonym2..m6 + colonyfix + decisionm1 + arrivalfix + feattest + fuzz all green." },
  { date:"2026-06-27", tag:"decision", title:"P3-M4 — Earth is a hidden TRUTH read through a BOUNDED belief; siblings only; + the launch handoff-reconciliation seam",
    body:"Three decisions shaped the build. (A) BOUNDED DIVERGENCE over a coin-flip (locked by Tom): Earth carries a hidden truth and a separately-shown estimate the crew hold from fragmentary signals. The estimate drifts toward truth with lag + noise but is CLAMPED to within one band of truth every tick — so belief can lag and jitter and honestly mislead, but can never flip to the opposite extreme, and the arrival (resolved on TRUTH) can differ from what the HUD showed. status is kept as a DERIVED view of the estimate (deriveEarthStatus) rather than migrating ~10 readers — the cheapest correct path, and it makes the long-dead 'faint' band reachable for free. Rejected: a single visible Earth meter (no surprise) and an unbounded random walk (belief could contradict reality wildly). (B) SIBLINGS, never a rewrite: voyageEarthSignal() and voyageAgeCrew() are new functions on game.voyage / v.crew (mirroring colonyAgeDrift and the P3-M3 voyageHazard* layer); the outbound earthSignal + ageCrew are left BYTE-IDENTICAL (md5-verified) so the outbound journey plays exactly as before. Rejected: parameterizing earthSignal(front) — it would touch the frozen outbound body and risk the byte-identical guarantee. exodusYears() is computed-on-read as the MAX of the concurrent colony/voyage contributions on top of shipYears (one wall-clock, not a sum) so it can't desync. (C) THE HANDOFF SEAM (a fix the committed plan OMITTED): the plan seeded truth/estimate at 2/2 and only stepped them on the voyage — but the OUTBOUND earthSignal can set status='silent' BEFORE launch. Left unhandled, the first voyageEarthSignal tick would derive 'faint' from estimate≈2 — REVIVING a silenced Earth — and the truth-based voyageArrive would then ignore the outbound silence (→ MESSENGER instead of TOO LATE). Resolved: at voyage CREATION (startVoyage — the single seam both doLaunch and beginReturn flow through, NOT the byte-identical outbound path) reconcile FROM the current earth.status — if silent, set truth = max(truth, 3) and estimate = truth (belief reflects the observed silence, no 'faint' flicker); else clamp estimate into [truth−1, truth+1]. Net: an Earth that went silent on the way out STAYS silent/worse into the voyage and resolves consistently at arrival — the belief model can never erase an established outbound outcome. The earthm4 SEAM CASE asserts exactly this. Scope: P3-M4 RESOLVES the Earth truth and surfaces the estimate/clock and wires voyage generations; it sets the state (earth.truth, the belief-derived status, exodusYears()) that M-INT1 will read — it does NOT generalize composeEnding (M-INT1) or add the focus toggle (M-INT1b)." },
  { date:"2026-06-27", tag:"feature", title:"P3-M3 — Sampled-severity HOME_HAZARDS (the home crossing gains a clean→catastrophic spectrum)",
